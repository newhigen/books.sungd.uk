<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>흩어진 책장</title>
<meta name="description" content="종이책과 리디·교보·킨들·구글북스에 흩어진 책을 한 곳에서 본다. books.sungd.uk" />
<meta name="color-scheme" content="light dark" />
<link rel="canonical" href="https://books.sungd.uk/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='7' width='5' height='18' rx='1' fill='%231e1c19'/%3E%3Crect x='12' y='7' width='5' height='18' rx='1' fill='%231e1c19'/%3E%3Crect x='19.5' y='10' width='5' height='15' rx='1' fill='none' stroke='%233c6b52' stroke-width='1.9' transform='rotate(11 22 17.5)'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500&display=swap" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf9f6; --surface:#fff; --surface2:#f2f1ec;
  --border:#e8e6df; --line-strong:#d9d6cc;
  --text:#1e1c19; --muted:#6d6a63; --ink-3:#9c988e;
  --acc:#3c6b52; --acc-bg:#eaf1ec;
  --shadow-sm:0 1px 2px rgba(30,28,25,.05),0 1px 3px rgba(30,28,25,.05);
  --shadow-md:0 3px 10px rgba(30,28,25,.07),0 10px 28px rgba(30,28,25,.08);
  --sans:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  --mono:'Google Sans Code',ui-monospace,'SF Mono',Menlo,monospace;
}
[data-theme="dark"]{
  --bg:#12110f; --surface:#1b1a17; --surface2:#242220;
  --border:#2c2a26; --line-strong:#3a3733;
  --text:#eceae5; --muted:#a09c93; --ink-3:#6e6a63;
  --acc:#7fb094; --acc-bg:#1e2a23;
  --shadow-sm:0 1px 2px rgba(0,0,0,.25);
  --shadow-md:0 3px 10px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.34);
}
html{scrollbar-gutter:stable}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;
     letter-spacing:-.01em;-webkit-font-smoothing:antialiased;padding-bottom:64px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
@media(max-width:480px){.wrap{padding:0 14px}}

/* ── 상단바 ── */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
     backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
.brand{font-weight:800;font-size:15.5px;letter-spacing:-.03em}
.count{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.themebtn{border:1px solid var(--border);background:var(--surface);color:var(--muted);
          border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:13px;line-height:1;
          display:grid;place-items:center;flex:none}
.themebtn:hover{border-color:var(--line-strong);color:var(--text)}

/* ── 검색·필터 ── */
.controls{padding-top:16px}
.search{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);
        border-radius:10px;padding:10px 13px;font-family:inherit;font-size:14px;letter-spacing:-.01em}
.search:focus{outline:none;border-color:var(--acc)}
.search::placeholder{color:var(--ink-3)}
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto;scrollbar-width:none;
      border-bottom:1px solid var(--border)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;color:var(--muted);font-family:inherit;font-size:13px;
     padding:8px 11px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;
     margin-bottom:-1px;letter-spacing:-.01em}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);font-weight:700;border-bottom-color:var(--acc)}
.tab i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:5px}
.tab.on i{color:var(--acc)}
.tab.empty{color:var(--ink-3)}
.bar{display:flex;align-items:center;gap:10px;padding:14px 0 4px;font-size:12.5px;color:var(--ink-3)}
.bar select{margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--muted);
            border-radius:7px;padding:4px 7px;font-family:inherit;font-size:12.5px;cursor:pointer}

/* ── 책 그리드 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:20px 14px;padding:10px 0 40px;min-width:0}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:26px 18px}}
/* min-width:0 이 없으면 아래 저자 줄(nowrap)이 칸의 최소폭을 밀어올려 페이지가 가로로 넘친다 */
.book{cursor:pointer;border:0;background:none;padding:0;text-align:left;font-family:inherit;color:inherit;
      display:flex;flex-direction:column;gap:7px;min-width:0}
.cv{position:relative;aspect-ratio:2/3;border-radius:3px;overflow:hidden;background:var(--surface2);
    box-shadow:var(--shadow-sm);transition:transform .18s ease,box-shadow .18s ease}
.book:hover .cv{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv .ph{width:100%;height:100%;display:flex;align-items:flex-end;padding:9px;font-size:11.5px;
        font-weight:700;line-height:1.35;letter-spacing:-.02em;word-break:keep-all;
        color:rgba(255,255,255,.94);text-shadow:0 1px 2px rgba(0,0,0,.2)}
.bt{font-size:12.5px;font-weight:600;line-height:1.35;letter-spacing:-.02em;word-break:keep-all;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ba{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.empty-msg{padding:60px 0;text-align:center;color:var(--ink-3);font-size:13px}

/* ── 상세 ── */
.sheet{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
       padding:20px;background:rgba(30,28,25,.42)}
.sheet.on{display:flex}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-md);
      max-width:440px;width:100%;max-height:86vh;overflow:auto;padding:20px}
@media(max-width:520px){
  .sheet{align-items:flex-end;padding:0}
  .card{border-radius:16px 16px 0 0;max-width:none;max-height:88vh;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
}
.chead{display:flex;gap:14px}
.chead .cv{width:88px;flex:none}
.ctitle{font-size:16px;font-weight:800;letter-spacing:-.03em;line-height:1.3;word-break:keep-all}
.cmeta{font-size:12.5px;color:var(--muted);margin-top:5px}
.cen{font-size:12px;color:var(--ink-3);font-style:italic;margin-top:2px}
.rows{margin-top:18px;border-top:1px solid var(--border)}
.row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.row dt{color:var(--ink-3);width:66px;flex:none;font-size:12.5px}
.row dd{flex:1}
.where{display:flex;flex-wrap:wrap;gap:6px}
.where a,.where span{font-size:12.5px;color:var(--acc);text-decoration:none;border-bottom:1px solid transparent}
.where a:hover{border-bottom-color:currentColor}
.tnum{font-family:var(--mono);font-size:12.5px}
.close{margin-top:16px;width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--muted);
       border-radius:9px;padding:9px;font-family:inherit;font-size:13px;cursor:pointer}
.close:hover{color:var(--text);border-color:var(--line-strong)}

/* ── 안내 ── */
.note{margin-top:14px;padding:12px 14px;background:var(--acc-bg);border-radius:10px;
      font-size:12.5px;color:var(--muted);line-height:1.6}
.note b{color:var(--text);font-weight:700}
.foot{padding:26px 0 10px;border-top:1px solid var(--border);font-size:12px;color:var(--ink-3)}
.foot a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--border)}
.foot a:hover{color:var(--acc);border-bottom-color:currentColor}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <span class="brand">책장</span>
    <span class="count" id="count"></span>
    <button class="themebtn" id="theme" title="밝게/어둡게" aria-label="테마 전환">◐</button>
  </div>
</header>

<main class="wrap">
  <div class="controls">
    <input class="search" id="q" type="search" placeholder="제목·저자 검색" autocomplete="off" />
    <nav class="tabs" id="tabs"></nav>
    <div class="bar">
      <span id="shown"></span>
      <select id="sort" aria-label="정렬">
        <option value="recent">최근 순</option>
        <option value="title">제목 순</option>
        <option value="author">저자 순</option>
      </select>
    </div>
    <div class="note" id="note" hidden></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="foot">
    <span id="updated"></span> ·
    <a href="https://writing.sungd.uk/books">읽은 기록</a> ·
    <a href="https://sungd.uk">sungd.uk</a>
  </div>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="card" id="card"></div>
</div>

<script>
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))

// 표지가 없는 책은 제목으로 색을 만들어 세워 둔다
function hue(s) {
  let h = 0
  for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) % 360
  return h
}
const placeholder = (b) =>
  `<div class="ph" style="background:linear-gradient(160deg,hsl(${hue(b.title)} 26% 46%),hsl(${(hue(b.title)+24)%360} 24% 34%))">${esc(b.title)}</div>`

const coverHTML = (b) =>
  b.cover ? `<img src="${esc(b.cover)}" alt="" loading="lazy" onerror="this.parentNode.innerHTML=this.dataset.ph" data-ph='${placeholder(b).replace(/'/g,"&#39;")}' />` : placeholder(b)

const state = { filter: 'all', sort: 'recent', q: '' }
let DATA = { books: [], services: [], updatedAt: '' }

const monthLabel = (m) => (m ? m.replace(/^(\d{4})-(\d{2})$/, '$1년 $2월').replace('년 0', '년 ') : '')

function serviceName(id) {
  return (DATA.services.find((s) => s.id === id) || {}).name || id
}

function visible() {
  const q = state.q.trim().toLowerCase()
  return DATA.books.filter((b) => {
    if (state.filter === 'none' && b.sources.length) return false
    if (state.filter !== 'all' && state.filter !== 'none' && !b.sources.some((s) => s.id === state.filter)) return false
    if (!q) return true
    return (b.title + ' ' + b.author + ' ' + b.englishTitle + ' ' + b.publisher).toLowerCase().includes(q)
  })
}

function sorted(list) {
  const copy = [...list]
  if (state.sort === 'title') copy.sort((a, b) => a.title.localeCompare(b.title, 'ko'))
  else if (state.sort === 'author') copy.sort((a, b) => (a.author || 'ㅎ').localeCompare(b.author || 'ㅎ', 'ko'))
  else copy.sort((a, b) => ((b.readAt || b.addedAt || '') + '').localeCompare(a.readAt || a.addedAt || ''))
  return copy
}

function render() {
  const list = sorted(visible())
  $('#grid').innerHTML = list.length
    ? list.map((b, i) => `
        <button class="book" data-i="${DATA.books.indexOf(b)}">
          <div class="cv">${coverHTML(b)}</div>
          <div class="bt">${esc(b.title)}</div>
          <div class="ba">${esc(b.author || '저자 미상')}</div>
        </button>`).join('')
    : `<div class="empty-msg">찾는 책이 없어요</div>`
  $('#shown').textContent = `${list.length}권`
  $('#tabs').querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.f === state.filter))
}

function openBook(b) {
  const where = b.sources.length
    ? b.sources.map((s) => s.link
        ? `<a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(serviceName(s.id))}</a>`
        : `<span>${esc(serviceName(s.id))}</span>`).join('')
    : '<span style="color:var(--ink-3)">아직 확인 안 됨</span>'

  $('#card').innerHTML = `
    <div class="chead">
      <div class="cv">${coverHTML(b)}</div>
      <div>
        <div class="ctitle">${esc(b.title)}</div>
        ${b.englishTitle ? `<div class="cen">${esc(b.englishTitle)}</div>` : ''}
        <div class="cmeta">${esc(b.author || '저자 미상')}${b.publisher ? ' · ' + esc(b.publisher) : ''}</div>
      </div>
    </div>
    <dl class="rows">
      <div class="row"><dt>어디에</dt><dd class="where">${where}</dd></div>
      <div class="row"><dt>읽음</dt><dd class="tnum">${b.read ? (monthLabel(b.readAt) || '읽음') : '아직'}</dd></div>
      ${b.aladin ? `<div class="row"><dt>책 정보</dt><dd class="where"><a href="${esc(b.aladin)}" target="_blank" rel="noopener">알라딘</a></dd></div>` : ''}
    </dl>
    <button class="close">닫기</button>`
  $('#sheet').classList.add('on')
}

function closeBook() { $('#sheet').classList.remove('on') }

// ── 이벤트 ──
$('#grid').addEventListener('click', (e) => {
  const el = e.target.closest('.book')
  if (el) openBook(DATA.books[+el.dataset.i])
})
$('#sheet').addEventListener('click', (e) => {
  if (e.target === $('#sheet') || e.target.classList.contains('close')) closeBook()
})
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBook() })
$('#q').addEventListener('input', (e) => { state.q = e.target.value; render() })
$('#sort').addEventListener('change', (e) => { state.sort = e.target.value; render() })

// 테마 — 전환 순간 transition 을 꺼서 카드가 하나씩 밀리지 않게
const setTheme = (t) => {
  document.documentElement.classList.add('theme-switching')
  document.documentElement.dataset.theme = t
  localStorage.setItem('shelf-theme', t)
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.documentElement.classList.remove('theme-switching')))
}
$('#theme').addEventListener('click', () =>
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'))
const saved = localStorage.getItem('shelf-theme')
if (saved) document.documentElement.dataset.theme = saved
else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'

// ── 데이터 ──
fetch('data/library.json?v=' + Date.now())
  .then((r) => r.json())
  .then((d) => {
    DATA = d
    const none = d.books.filter((b) => !b.sources.length).length
    const tabs = [{ id: 'all', name: '전체', count: d.books.length }]
      .concat(d.services.map((s) => ({ id: s.id, name: s.name, count: s.count })))
    if (none) tabs.push({ id: 'none', name: '소장처 미확인', count: none })
    $('#tabs').innerHTML = tabs.map((t) =>
      `<button class="tab${t.count ? '' : ' empty'}" data-f="${t.id}">${esc(t.name)}<i>${t.count}</i></button>`).join('')
    $('#tabs').addEventListener('click', (e) => {
      const t = e.target.closest('.tab')
      if (t) { state.filter = t.dataset.f; render() }
    })
    $('#count').textContent = `${d.total}권`
    $('#updated').textContent = `${d.updatedAt} 갱신`
    if (!d.services.length) {
      $('#note').hidden = false
      $('#note').innerHTML = '아직 <b>읽은 기록</b>만 들어와 있어요. 리디·교보·킨들·구글북스 서재를 모으면 책마다 어디에 있는지 표시됩니다.'
    }
    render()
  })
  .catch(() => { $('#grid').innerHTML = '<div class="empty-msg">데이터를 불러오지 못했어요</div>' })
</script>
<style>.theme-switching *{transition:none !important}</style>
</body>
</html>
