<style>
/* 스위트(SUITE) — 눈누 웹폰트 */
@font-face{font-family:'SUITE';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/SUITE-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'SUITE';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/SUITE-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'SUITE';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/SUITE-SemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'SUITE';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/SUITE-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff; --ink:#1d1f22; --ink2:#4d5159; --mut:#6b7079; --faint:#8c9199;
  --rule:#dcdee2; --line:#e2e4e8; --card:#f7f8f9; --strong:#2c2f34; --acc:#2b59c3;
  --spine-height:24px; --spine-font:12px;
  --sans:'SUITE',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;
  --serif:'Noto Serif KR',Georgia,serif;
}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:12px/1.5 var(--sans);word-break:keep-all;
     -webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
[hidden]{display:none !important}
.wrap{padding:12px 12px 26px}

/* ── 머리 ── */
.header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
h1{font:500 21px/1.3 var(--serif);white-space:nowrap}
.count{font-size:11px;white-space:nowrap;color:var(--mut)}

/* ── 찾기 ── */
.searchbar{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--rule);
           padding-bottom:2px;margin-bottom:9px}
.searchbar:focus-within{border-bottom-color:var(--acc)}
.searchbar svg{flex:none;color:var(--faint)}
.search{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;border-radius:0;
        font:400 19px/1.4 var(--sans);color:var(--ink);outline:none}
.search::placeholder{color:var(--faint)}
.search::-webkit-search-cancel-button{display:none}
.search:focus-visible{outline:none}   /* 밑줄이 이미 포커스를 알린다 */
.clear{color:var(--mut);font-size:12px;padding:7px 9px;border-radius:14px;min-height:32px}
.clear:hover{background:var(--card)}
.exact{font-size:11px;padding:6px 11px;border-radius:14px;border:1px solid var(--rule);
       color:var(--ink2);background:var(--card);min-height:32px;white-space:nowrap}
.exact[aria-pressed=true]{background:var(--strong);border-color:var(--strong);color:#fff;font-weight:600}

/* ── 칩 줄 — 안 찾을 땐 소장처, 찾는 중엔 걸린 자리 ── */
.chipbar{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
/* 순서 — 거르개와 다른 일을 하니 눌린 모양도 다르게(먹 대신 강조색) */
.sorts{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-left:auto}
.sorts > span{font-size:11px;color:var(--faint);white-space:nowrap;margin-right:1px}
.sorts button{font-size:11.5px;padding:5px 10px;border-radius:20px;border:1px solid var(--rule);
              color:var(--ink2);background:var(--card);min-height:30px;white-space:nowrap}
.sorts button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chips button{font-size:11.5px;padding:5px 10px;border-radius:20px;border:1px solid var(--rule);
              color:var(--ink2);background:var(--card);min-height:30px;white-space:nowrap}
.chips button span{font-variant-numeric:tabular-nums;opacity:.65;margin-left:5px}
.chips button[aria-pressed=true]{background:var(--strong);border-color:var(--strong);color:#fff;font-weight:600}
.chips button[aria-pressed=true] span{opacity:.8}
.chips .sep{width:1px;height:18px;background:var(--line);margin-inline:3px}
.chips .hint{font-size:11px;color:var(--faint)}
.chip-note{font-size:11px;color:var(--faint);margin-bottom:8px}

/* ── 책장 ── */
.rack{display:grid;gap:14px;align-items:start}
.column{min-width:0}
/* 찾는 중 — 갈래마다 한 줄, 이름은 왼쪽에 한 번 */
.rack.lanes{display:flex;flex-direction:column;align-items:stretch;gap:11px}
.lane{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;align-items:start}
.lane .label{padding-top:2px}
.lane .label b{display:block;font:600 12px/1.4 var(--sans);color:var(--ink2)}
.lane .label i{font-style:normal;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.lane .label.near b{color:var(--mut);font-weight:500}
.lane .bin{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:0 8px;align-content:start}
.subject{margin:0;display:flex;gap:4px;align-items:center;justify-content:space-between;
         font:500 11px/1.3 var(--sans);height:24px;color:var(--ink2);white-space:nowrap}
.subject span{font-weight:400;font-size:10px;color:var(--faint)}
.book{display:block;width:100%;height:var(--spine-height);margin:0 0 2px;padding:2px 6px;
      border-left:3px solid #ffffff30;border-right:2px solid #00000010;border-radius:2px 3px 3px 2px;
      background:var(--book-color);color:var(--book-ink);
      box-shadow:inset 0 1px 0 #ffffff24,inset 0 -1px 0 #00000014;
      text-align:left;font-size:var(--spine-font);line-height:1.4;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;touch-action:manipulation}
.book:hover{filter:brightness(1.07)}
.book[aria-pressed=true]{outline:2px solid var(--acc);outline-offset:1px;position:relative;z-index:1}
.book:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.empty{padding:30px 0;color:var(--mut)}

/* ── 고른 책 — 아래에 붙어 스크롤을 따라온다 ── */
.detail{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
        border-top:1px solid var(--line);
        padding:9px 12px calc(9px + env(safe-area-inset-bottom, 0px));
        display:grid;grid-template-columns:39px minmax(0,1fr) auto;gap:10px;align-items:center;
        box-shadow:0 -4px 18px rgba(41,44,36,.16)}
.detail img{width:39px;height:56px;object-fit:cover}
.detail .noimg{width:39px;height:56px;background:var(--line)}
.detail h2{font:500 15px/1.4 var(--serif);overflow-wrap:anywhere}
.detail p{font-size:12px;margin:2px 0;color:var(--ink2)}
.detail .where{color:#3f5a34}
.detail .borrow{color:#8a6339}
.detail .close{color:var(--mut);min-height:32px;min-width:32px;padding:5px;font-size:11px}

/* ── 꼬리 ── */
.foot{font-size:11px;color:var(--faint);margin-top:14px}
.foot a{color:var(--mut)}

@media (max-width:550px){
  .wrap{padding:7px 7px 20px}
  :root{--spine-font:11px}
  .header{gap:7px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:19px}
  .searchbar{gap:6px;margin-bottom:7px}
  .search{font-size:17px;padding:6px 0}
  .clear{padding:6px 7px;min-height:30px}
  .exact{padding:5px 9px;min-height:30px}
  /* 폰에서는 칩 열한 개가 줄을 넘어 층층이 쌓인다 — 두 줄로 세우고 각 줄은 옆으로 민다 */
  .chipbar{flex-direction:column;align-items:stretch;gap:5px;margin-bottom:6px}
  .chips,.sorts{flex-wrap:nowrap;overflow-x:auto;gap:4px;margin-left:0;
                scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar,.sorts::-webkit-scrollbar{display:none}
  .chips button,.sorts button{flex:none;min-height:28px;padding:4px 9px}
  .sorts > span{flex:none}
  .chips button{min-height:28px;padding:4px 9px}
  .lane{grid-template-columns:1fr;gap:2px}
  .lane .label{display:flex;gap:6px;align-items:baseline}
  .lane .bin{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:0 5px}
  .rack{gap:10px}
  .rack.lanes{gap:8px}
  .book{padding-inline:5px;min-height:36px}
  .detail{grid-template-columns:32px minmax(0,1fr) auto;gap:7px}
  .detail img,.detail .noimg{width:32px;height:46px}
  .detail h2{font-size:14px}
  .detail .close{min-width:44px;min-height:44px}
  .subject{height:25px}
}
/* 손가락 최소 크기 — 폰은 좁아서 위 550px 규칙이 36px 로 줄인다 */
@media (pointer:coarse) and (min-width:551px){
  .book{min-height:44px}
}
@media (pointer:coarse){
  .detail .close{min-width:44px;min-height:44px}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>내 책장</h1>
    <span class="count" id="count">읽는 중…</span>
  </div>

  <div class="searchbar">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-4.5-4.5" /></svg>
    <input class="search" id="q" type="search" placeholder="제목이나 저자, 주제로 찾기"
           aria-label="제목이나 저자, 주제로 찾기" />
    <button class="clear" id="clear" type="button" hidden>지우기</button>
    <button class="exact" id="exact" type="button" aria-pressed="false">정확히</button>
  </div>

  <div class="chipbar">
    <div class="chips" id="chips"></div>
    <div class="sorts" id="sorts"><span>순서</span></div>
  </div>
  <p class="chip-note" id="note" hidden></p>

  <div class="rack" id="rack"></div>

  <p class="foot">
    <span id="updated"></span> ·
    <a href="https://writing.sungd.uk/books">읽은 기록</a> ·
    <a href="https://sungd.uk">sungd.uk</a>
  </p>
</div>

<div class="detail" id="detail" hidden></div>

<script>
const TOPICS = ['개발·기술','데이터·AI','만들기','배우기·생각','일·조직','삶·교양','문학','마음·관계','몸·취미','미분류']
const PALETTE = {
  '개발·기술':['#cedbef','#687fa2'], '데이터·AI':['#d2e0f1','#6685a5'], '만들기':['#d5e5ea','#698f9a'],
  '배우기·생각':['#e1dced','#8a7e9e'], '일·조직':['#e6dfeb','#938099'], '삶·교양':['#ecdfc9','#a38b65'],
  '문학':['#f0e1ce','#ab8b65'], '마음·관계':['#dce6d5','#82966d'], '몸·취미':['#d6e5dc','#719385'],
  '미분류':['#e2e2dd','#95978b'],
}
const SRC_NAME = { paper:'종이책', company:'회사에서 빌림', library:'도서관에서 빌림', friend:'지인에게 빌림',
                   kyobo:'교보', ridi:'리디', kindle:'킨들', google:'구글북스', pdf:'PDF' }
const SRC_FILTER = {
  owned: ['paper','kyobo','ridi','kindle','google','pdf'],
  ebook: ['kyobo','ridi','kindle','google','pdf'],
  borrowed: ['company','library','friend'],
}
const NOTE = {
  owned: '종이책과 전자책, PDF 로 소장처가 기록된 책이에요.',
  ebook: '교보, 리디, 킨들, 구글북스와 PDF 에 있는 책이에요.',
  borrowed: '회사, 도서관, 지인에게 빌린 것으로 기록된 책이에요. 반납 여부는 구분하지 않아요.',
}
const FILTER_NAMES = [['all','전체'],['owned','소장한 책'],['ebook','전자책'],['borrowed','빌린 책']]
const MAX_COLUMNS = 6

/* 한글 초성 — 'ㄷㅇㅌ' 로 '데이터' 를 찾는다 */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'
const toCho = (s) => [...s].map((c) => {
  const i = c.charCodeAt(0) - 0xac00
  return i >= 0 && i < 11172 ? CHO[Math.floor(i / 588)] : c
}).join('')
/* 느슨하게 — 띄어쓰기와 문장부호를 지우고 견준다 */
const loose = (s) => s.toLowerCase().replace(/[\s·・,.\-—–()[\]「」『』'"!?:;~]/g, '')
const isCho = (q) => /^[\u3131-\u314e]+$/.test(q.replace(/\s/g, ''))

/* 어근이 같으면 걸리게 — '프로그래밍' 으로 '프로그래머' 를 찾는다.
   한국어는 말끝이 바뀌니 앞에서부터 얼마나 겹치는지를 본다. */
function stemHit(text, q) {
  if (q.length < 4) return false   // 짧은 말은 앞 두세 글자만 겹쳐도 엉뚱한 게 걸린다
  const need = Math.max(4, Math.ceil(q.length * 0.7))
  for (let i = 0; i + need <= text.length; i++) {
    let k = 0
    while (k < q.length && i + k < text.length && text[i + k] === q[k]) k++
    if (k >= need) return true
  }
  return false
}

/* 어느 자리에서 걸렸는지 — 제목이 먼저다 */
const FIELDS = [
  ['제목', (b) => b.title],
  ['저자', (b) => b.author || ''],
  ['주제', (b) => [...(b.groups || []), ...(b.tags || [])].join(' ')],
  ['정리', (b) => b.gist || ''],
]
function hitField(b, q, exact) {
  if (exact) {
    const nq = q.toLowerCase()
    for (const [name, get] of FIELDS) {
      const val = get(b)
      if (val && val.toLowerCase().includes(nq)) return { f: name, near: false }
    }
    return null
  }
  const nq = loose(q)
  if (!nq) return null
  // 그대로 들어 있는 것이 먼저
  for (const [name, get] of FIELDS) {
    const val = get(b); if (!val) continue
    if (loose(val).includes(nq)) return { f: name, near: false }
  }
  // 초성만 친 경우
  if (isCho(q)) for (const [name, get] of FIELDS) {
    const val = get(b); if (!val) continue
    if (toCho(loose(val)).includes(nq)) return { f: name, near: false }
  }
  // 말끝만 다른 것 — 제목과 주제에서만 본다. 정리 글은 길어서 아무거나 걸린다
  for (const [name, get] of FIELDS) {
    if (name !== '제목' && name !== '주제') continue
    const val = get(b); if (!val) continue
    if (stemHit(loose(val), nq)) return { f: name, near: true }
  }
  return null
}

const $ = (s) => document.querySelector(s)
const rack = $('#rack'), detail = $('#detail')
const safe = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))

let BOOKS = [], query = '', selected = null, active = 'all', lane = null, lastWidth = 0, exact = false, sortBy = 'topic', readOnly = null

/* 대표 주제는 첫 번째 것 하나 — 한 책이 여러 칸에 나오면 밀도가 낭비된다 */
const subjectOf = (b) => (b.groups || [])[0] || '미분류'
const idsOf = (b) => (b.sources || []).map((s) => s.id)
const inFilter = (b, key) => key === 'all' || idsOf(b).some((id) => SRC_FILTER[key].includes(id))
/* 읽음은 소장처와 다른 축이라 따로 건다 — 「소장한 책 중 안 읽은 것」 처럼 겹쳐 쓸 수 있다 */
const passRead = (b) => !readOnly || (readOnly === 'read' ? !!b.read : !b.read)

/* 같은 주제 안에서는 옅은 명도 차이만 둔다 */
function bookColor(b) {
  const base = (PALETTE[subjectOf(b)] || PALETTE['미분류'])[0]
  const hash = Array.from(b.title).reduce((n, c) => (n + c.codePointAt(0)) % 997, 0)
  const shift = [-9, -4, 0, 4, 8][hash % 5]
  return '#' + [1, 3, 5].map((i) =>
    Math.max(0, Math.min(255, parseInt(base.slice(i, i + 2), 16) + shift)).toString(16).padStart(2, '0')).join('')
}
/* 배경 밝기에 맞춰 글자색을 고른다 */
function ink(hex) {
  const c = hex.slice(1)
  const a = [0, 2, 4].map((i) => parseInt(c.slice(i, i + 2), 16) / 255)
                     .map((v) => v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4))
  return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2] > 0.179 ? '#171a16' : '#ffffff'
}

/* 원서가 먼저 나온 책은 두 해를 다 보인다 */
function yearText(b) {
  if (!b.koYear && !b.origYear) return ''
  if (b.origYear && b.koYear && b.origYear !== b.koYear) return ` · ${b.koYear} (원서 ${b.origYear})`
  return ` · ${b.koYear || b.origYear}`
}

function showDetail() {
  detail.hidden = selected === null
  rack.querySelectorAll('.book').forEach((e) => e.setAttribute('aria-pressed', String(e.dataset.id === selected)))
  if (selected === null) { document.body.style.paddingBottom = ''; return }
  const b = BOOKS.find((x) => x.id === selected)
  if (!b) return
  const where = idsOf(b).map((id) =>
    `<span class="${SRC_FILTER.borrowed.includes(id) ? 'borrow' : ''}">${safe(SRC_NAME[id] || id)}</span>`
  ).join(' / ') || '소장처 미확인'
  detail.innerHTML =
    (b.cover ? `<img src="${safe(b.cover)}" alt="${safe(b.title)} 표지" loading="lazy" />` : '<span class="noimg"></span>') +
    `<div><h2>${safe(b.title)}</h2>` +
    `<p>${safe(b.author || '저자 미등록')}${yearText(b)}${b.gist ? ' — ' + safe(b.gist) : ''}</p>` +
    `<p class="where">${where}</p></div>` +
    '<button class="close" type="button" aria-label="책 정보 닫기">닫기</button>'
  detail.querySelector('button').onclick = () => {
    const id = selected
    selected = null
    showDetail()
    rack.querySelector(`[data-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: true })
  }
  document.body.style.paddingBottom = detail.offsetHeight + 'px'
}

/* 칸 하나를 만든다 */
function chip(label, count, on, click) {
  const btn = document.createElement('button')
  btn.type = 'button'
  btn.setAttribute('aria-pressed', String(on))
  btn.innerHTML = `${safe(label)} <span>${count}</span>`
  btn.onclick = click
  return btn
}

/* 안 찾을 땐 소장처로 거르고, 찾는 중엔 걸린 자리로 거른다 — 줄이 하나로 유지된다 */
/* 고른 순서대로 책을 세운다. 연도가 없는 책은 언제나 뒤로 민다 */
const SORT_NAMES = [['topic','주제별'],['newest','최신순'],['oldest','오래된순'],['title','제목순'],['author','저자순']]
const SORTERS = {
  topic: null,   // 빌드가 매긴 순서(읽은 달 최신)를 그대로 쓴다
  title: (a, b) => a.title.localeCompare(b.title, 'ko'),
  author: (a, b) => (a.author || 'ㅎㅎ').localeCompare(b.author || 'ㅎㅎ', 'ko') || a.title.localeCompare(b.title, 'ko'),
  oldest: (a, b) => (a.year || '9999').localeCompare(b.year || '9999') || a.title.localeCompare(b.title, 'ko'),
  newest: (a, b) => (b.year || '0000').localeCompare(a.year || '0000') || a.title.localeCompare(b.title, 'ko'),
}
const sorted = (list) => SORTERS[sortBy] ? [...list].sort(SORTERS[sortBy]) : list
/* 2010년부터는 해마다 나누고 그 이전은 연대로 묶는다 — 최근으로 올수록 책이 많아서
   연대로 두면 한 줄에 백 권씩 쌓인다 */
const YEAR_FROM = 2010
const bucketOf = (y) => !y ? '연도 모름'
  : +y >= YEAR_FROM ? y + '년' : Math.floor(+y / 10) * 10 + '년대'

function makeSpine(b) {
  const btn = document.createElement('button')
  btn.type = 'button'
  btn.className = 'book'
  btn.dataset.id = b.id
  btn.textContent = b.title
  btn.setAttribute('aria-label', b.title)
  btn.setAttribute('aria-pressed', String(selected === b.id))
  const color = bookColor(b)
  btn.style.setProperty('--book-color', color)
  btn.style.setProperty('--book-ink', ink(color))
  btn.onclick = () => { selected = selected === b.id ? null : b.id; showDetail() }
  return btn
}

function drawChips(matches, groups, searching) {
  const chips = $('#chips'), note = $('#note')
  chips.innerHTML = ''
  if (searching) {
    chips.append(chip('찾은 책', matches.filter((b) => inFilter(b, active) && passRead(b)).length, lane === null,
                      () => { lane = null; render() }))
    const sep = document.createElement('span'); sep.className = 'sep'; chips.append(sep)
    for (const g of groups) {
      chips.append(chip(g.t.replace('에서', ''), g.items.length, lane === g.k,
                        () => { lane = lane === g.k ? null : g.k; render() }))
    }
    const hint = document.createElement('span')
    hint.className = 'hint'
    hint.textContent = exact ? '글자 그대로 찾았어요' : '띄어쓰기와 부호는 무시하고 말끝이 달라도 찾아요'
    chips.append(hint)
    note.hidden = true
    return
  }
  // 읽음이 왼쪽, 소장처가 오른쪽. 개수는 서로의 거르개를 통과한 것만 센다
  for (const [key, label, want] of [['read','읽은 책',true], ['unread','안 읽은 책',false]]) {
    chips.append(chip(label, matches.filter((b) => inFilter(b, active) && !!b.read === want).length,
                      readOnly === key, () => { readOnly = readOnly === key ? null : key; lane = null; render() }))
  }
  const sep = document.createElement('span'); sep.className = 'sep'; chips.append(sep)
  for (const [key, label] of FILTER_NAMES) {
    chips.append(chip(label, matches.filter((b) => passRead(b) && inFilter(b, key)).length, key === active,
                      () => { active = key; lane = null; render() }))
  }
  note.hidden = active === 'all'
  note.textContent = NOTE[active] || ''
}

/* 순서 칩 — 찾는 중에도 그대로 보인다 */
function drawSorts() {
  const box = $('#sorts')
  box.querySelectorAll('button').forEach((b) => b.remove())
  for (const [key, label] of SORT_NAMES) {
    const btn = document.createElement('button')
    btn.type = 'button'
    btn.textContent = label
    btn.setAttribute('aria-pressed', String(key === sortBy))
    btn.onclick = () => { sortBy = key; lane = null; render() }
    box.append(btn)
  }
}

function render() {
  const width = rack.getBoundingClientRect().width
  const n = Math.min(MAX_COLUMNS, Math.max(2, Math.floor((width + 6) / 150)))
  const searching = query.length > 0
  const matches = []
  for (const b of BOOKS) {
    const hit = searching ? hitField(b, query, exact) : null
    if (searching && !hit) continue
    b.hit = hit ? hit.f : null
    b.near = hit ? hit.near : false
    matches.push(b)
  }
  $('#clear').hidden = !searching
  const found = matches.filter((b) => inFilter(b, active) && passRead(b))
  $('#count').textContent = found.length + '권' + (query ? ' 찾음' : '')

  // 찾는 중이면 걸린 자리로, 아니면 고른 순서에 맞는 묶음으로 나눈다
  let groups
  if (searching) {
    groups = [...['제목','저자','주제','정리'].map((f) =>
          ({ k: f, t: f + '에서', items: found.filter((b) => b.hit === f && !b.near) })),
       { k: 'near', t: '말끝만 다른 것', items: found.filter((b) => b.near) }].filter((g) => g.items.length)
  } else if (sortBy === 'oldest' || sortBy === 'newest') {
    // 연대로 묶는다 — 「2010년대」 안에서 다시 연도순
    const by = new Map()
    for (const b of sorted(found)) {
      const d = bucketOf(b.year)
      if (!by.has(d)) by.set(d, [])
      by.get(d).push(b)
    }
    groups = [...by].map(([d, items]) => ({ k: d, t: d, items }))
  } else if (sortBy === 'topic') {
    groups = TOPICS.map((t) => ({ k: t, t, items: found.filter((b) => subjectOf(b) === t) })).filter((g) => g.items.length)
  } else {
    groups = [{ k: 'all', t: '', items: sorted(found) }]
  }
  for (const g of groups) if (searching) g.items = sorted(g.items)
  if (lane && !groups.some((g) => g.k === lane)) lane = null
  drawChips(matches, groups, searching)
  drawSorts()

  const asLanes = searching || sortBy === 'oldest' || sortBy === 'newest'
  rack.innerHTML = ''
  rack.classList.toggle('lanes', asLanes)
  if (!found.length) {
    rack.classList.remove('lanes')
    rack.innerHTML = `<div class="empty">찾은 책이 없어요.${exact ? ' 「정확히」를 꺼 보세요.' : ''}</div>`
    selected = null; showDetail(); return
  }

  // 갈래마다 한 줄, 이름은 왼쪽에 한 번. 칸이 남으면 여러 열로 채운다
  if (asLanes) {
    for (const g of (lane ? groups.filter((x) => x.k === lane) : groups)) {
      const row = document.createElement('section')
      row.className = 'lane'
      const label = document.createElement('h2')
      label.className = 'label' + (g.k === 'near' ? ' near' : '')
      label.innerHTML = `<b>${safe(g.t.replace('에서', ''))}</b><i>${g.items.length}권</i>`
      const bin = document.createElement('div')
      bin.className = 'bin'
      for (const b of g.items) bin.append(makeSpine(b))
      row.append(label, bin)
      rack.append(row)
    }
    if (selected !== null && !found.some((b) => b.id === selected)) { selected = null; showDetail() }
    return
  }

  rack.style.gridTemplateColumns = `repeat(${n},minmax(0,1fr))`
  const capacity = Math.ceil((found.length + groups.length) / n) + 1
  let column = null, used = 0, colIndex = -1
  const newColumn = () => { column = document.createElement('section'); column.className = 'column'; rack.append(column); used = 0; colIndex++ }
  const heading = (t, count, continued) => {
    const h = document.createElement('h2')
    h.className = 'subject'
    h.innerHTML = safe(t.replaceAll('·', ' / ')) + `<span>${continued ? '계속' : count + '권'}</span>`
    column.append(h); used++
  }

  newColumn()
  for (const group of groups) {
    if (!group.t) {   // 제목·저자 순 — 묶음이 하나뿐이라 머리를 달지 않는다
      for (const b of group.items) {
        if (used >= capacity && colIndex < n - 1) newColumn()
        column.append(makeSpine(b)); used++
      }
      continue
    }
    if (used + 3 > capacity && colIndex < n - 1) newColumn()
    heading(group.t, group.items.length, false)
    for (const b of group.items) {
      if (used >= capacity && colIndex < n - 1) { newColumn(); heading(group.t, group.items.length, true) }
      column.append(makeSpine(b)); used++
    }
  }
  if (selected !== null && !found.some((b) => b.id === selected)) { selected = null; showDetail() }
}

$('#q').addEventListener('input', (e) => { query = e.target.value.trim(); lane = null; render() })
$('#clear').addEventListener('click', () => {
  $('#q').value = ''; query = ''; lane = null; render(); $('#q').focus()
})
$('#exact').addEventListener('click', () => {
  exact = !exact
  $('#exact').setAttribute('aria-pressed', String(exact))
  render()
})
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && selected !== null) { selected = null; showDetail() } })

fetch('data/library.json')
  .then((r) => r.json())
  .then((d) => {
    // 제목이 안정적인 열쇠다 — 배열 자리는 데이터가 바뀌면 흔들린다
    BOOKS = d.books.map((b) => ({ ...b, id: b.title }))
    $('#updated').textContent = `${d.updatedAt} 갱신`
    render()
    new ResizeObserver(() => {
      const w = Math.round(rack.getBoundingClientRect().width)
      if (w !== lastWidth) { lastWidth = w; render() }
    }).observe(rack)
  })
  .catch(() => {
    $('#count').textContent = ''
    rack.innerHTML = '<div class="empty">책 목록을 불러오지 못했어요. 새로 고쳐 주세요.</div>'
  })
</script>
</body>
</html>
