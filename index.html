<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>책장</title>
<meta name="description" content="종이책과 리디·교보·킨들·구글북스에 흩어진 책을 한 곳에서 본다. books.sungd.uk" />
<meta name="color-scheme" content="light" />
<link rel="canonical" href="https://books.sungd.uk/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='6' width='22' height='4' rx='1' fill='%23687fa2'/%3E%3Crect x='5' y='12' width='22' height='4' rx='1' fill='%238a7e9e'/%3E%3Crect x='5' y='18' width='22' height='4' rx='1' fill='%23a38b65'/%3E%3Crect x='5' y='24' width='22' height='3' rx='1' fill='%2382966d'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500&display=swap" />
<!-- Google Analytics -->

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  // 내 기기 표시: 어느 사이트든 ?me=1 로 한 번 열면 .sungd.uk 쿠키가 심긴다 (?me=0 으로 해제)

    try {
      var m = new URLSearchParams(location.search).get('me')
      if (m === '1') document.cookie = 'sd_owner=1; domain=.sungd.uk; path=/; max-age=63072000; samesite=lax; secure'
      if (m === '0') document.cookie = 'sd_owner=; domain=.sungd.uk; path=/; max-age=0; samesite=lax; secure'
    } catch (e) {}
    window.__sdOwner = /(?:^|;\s*)sd_owner=1(?:;|$)/.test(document.cookie)
  })();
  gtag('set', 'user_properties', { visitor_type: window.__sdOwner ? 'owner' : 'visitor' });

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f0e7; --ink:#292c24; --ink2:#5a6050; --mut:#6e7164; --faint:#838575;
  --rule:#c8baa5; --line:#cecbbb; --card:#fffdf6; --acc:#2b59c3;
  --spine-height:24px; --spine-font:12px;
  --sans:'Wanted Sans Variable','Wanted Sans',-apple-system,system-ui,sans-serif;
  --serif:'Noto Serif KR',Georgia,serif;
}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:12px/1.5 var(--sans);word-break:keep-all;
     -webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
[hidden]{display:none !important}
.wrap{padding:12px 12px 26px}

/* ── 머리 ── */
.header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
h1{font:500 21px/1.3 var(--serif);white-space:nowrap}
.count{font-size:11px;white-space:nowrap;color:var(--mut)}
.search{margin-left:auto;width:230px;min-width:0;border:0;border-bottom:1px solid #b9b9a9;
        background:transparent;padding:7px 1px;border-radius:0;font-size:16px;color:#3c4233;outline:none}
.search:focus{border-bottom-color:var(--acc)}
.search::placeholder{color:#9c9c8c}

/* ── 거르개 ── */
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.filters button{font-size:11.5px;padding:5px 10px;border-radius:20px;border:1px solid #cfc7b6;
                color:var(--ink2);background:#fbf9f3;min-height:30px;white-space:nowrap}
.filters button span{font-variant-numeric:tabular-nums;opacity:.65;margin-left:4px}
.filters button[aria-pressed=true]{background:#40453a;border-color:#40453a;color:#fbf9f3;font-weight:600}
.filters button[aria-pressed=true] span{opacity:.8}
.filter-note{font-size:11px;color:var(--faint);margin-bottom:8px}

/* ── 책장 ── */
.rack{display:grid;gap:5px;align-items:start}
.column{min-width:0;border-right:2px solid var(--rule);padding-right:4px}
.column:last-child{border:0;padding-right:0}
.subject{margin:0;display:flex;gap:4px;align-items:center;justify-content:space-between;
         font:500 11px/1.3 var(--sans);height:24px;color:var(--ink2);white-space:nowrap}
.subject span{font-weight:400;font-size:10px;color:var(--faint)}
.book{display:block;width:100%;height:var(--spine-height);margin:0 0 2px;padding:2px 6px;
      border-left:3px solid #ffffff30;border-right:2px solid #00000010;border-radius:2px 3px 3px 2px;
      background:var(--book-color);color:var(--book-ink);
      box-shadow:inset 0 1px 0 #ffffff24,inset 0 -1px 0 #00000014;
      text-align:left;font-size:var(--spine-font);line-height:1.4;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;touch-action:manipulation}
.book:hover{filter:brightness(1.07)}
.book[aria-pressed=true]{outline:2px solid var(--acc);outline-offset:1px;position:relative;z-index:1}
.book:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.empty{padding:30px 0;color:#737a65}

/* ── 고른 책 — 아래에 붙어 스크롤을 따라온다 ── */
.detail{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
        border-top:1px solid var(--line);
        padding:9px 12px calc(9px + env(safe-area-inset-bottom, 0px));
        display:grid;grid-template-columns:39px minmax(0,1fr) auto;gap:10px;align-items:center;
        box-shadow:0 -4px 18px rgba(41,44,36,.16)}
.detail img{width:39px;height:56px;object-fit:cover}
.detail .noimg{width:39px;height:56px;background:#eae5d9}
.detail h2{font:500 15px/1.4 var(--serif);overflow-wrap:anywhere}
.detail p{font-size:12px;margin:2px 0;color:#686e5c}
.detail .where{color:#515d43}
.detail .borrow{color:#8a6339}
.detail .close{color:#6e765f;min-height:32px;min-width:32px;padding:5px;font-size:11px}

/* ── 꼬리 ── */
.footer{font-size:11px;color:#777b6a;margin-top:9px}
.foot{font-size:11px;color:var(--faint);margin-top:6px}
.foot a{color:var(--mut)}

@media (max-width:550px){
  .wrap{padding:9px 9px 24px}
  :root{--spine-font:11px}
  .header{gap:8px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:19px}
  .search{width:100%;margin:0;flex-basis:100%;padding:5px 0}
  .column{padding-right:3px;border-width:1px}
  .book{padding-inline:4px}
  .detail{grid-template-columns:32px minmax(0,1fr) auto;gap:7px}
  .detail img,.detail .noimg{width:32px;height:46px}
  .detail h2{font-size:14px}
  .detail .close{min-width:44px;min-height:44px}
  .subject{height:25px}
}
@media (pointer:coarse){
  .book{min-height:44px}
  .detail .close{min-width:44px;min-height:44px}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>내 책장</h1>
    <span class="count" id="count">읽는 중…</span>
    <input class="search" id="q" type="search" placeholder="제목이나 저자로 찾기" aria-label="제목이나 저자로 찾기" />
  </div>

  <div class="filters" id="filters">
    <button type="button" data-filter="all" aria-pressed="true">전체 <span></span></button>
    <button type="button" data-filter="owned" aria-pressed="false">소장한 책 <span></span></button>
    <button type="button" data-filter="ebook" aria-pressed="false">전자책 <span></span></button>
    <button type="button" data-filter="borrowed" aria-pressed="false">빌린 책 <span></span></button>
  </div>
  <p class="filter-note" id="note" hidden></p>

  <div class="rack" id="rack"></div>

  <p class="footer">책등 색은 주제별로 묶었어요. 책을 누르면 실제 표지와 전체 제목이 보여요. 여러 주제의 책은 첫 주제에 한 번만 놓았어요.</p>
  <p class="foot">
    <span id="updated"></span> ·
    <a href="plain.html">간단히 보기</a> ·
    <a href="https://writing.sungd.uk/books">읽은 기록</a> ·
    <a href="https://sungd.uk">sungd.uk</a>
  </p>
</div>

<div class="detail" id="detail" hidden></div>

<script>
const TOPICS = ['개발·기술','데이터·AI','만들기','배우기·생각','일·조직','삶·교양','문학','마음·관계','몸·취미','미분류']
const PALETTE = {
  '개발·기술':['#cedbef','#687fa2'], '데이터·AI':['#d2e0f1','#6685a5'], '만들기':['#d5e5ea','#698f9a'],
  '배우기·생각':['#e1dced','#8a7e9e'], '일·조직':['#e6dfeb','#938099'], '삶·교양':['#ecdfc9','#a38b65'],
  '문학':['#f0e1ce','#ab8b65'], '마음·관계':['#dce6d5','#82966d'], '몸·취미':['#d6e5dc','#719385'],
  '미분류':['#e2e2dd','#95978b'],
}
const SRC_NAME = { paper:'종이책', company:'회사에서 빌림', library:'도서관에서 빌림', friend:'지인에게 빌림',
                   kyobo:'교보', ridi:'리디', kindle:'킨들', google:'구글북스', pdf:'PDF' }
const SRC_FILTER = {
  owned: ['paper','kyobo','ridi','kindle','google','pdf'],
  ebook: ['kyobo','ridi','kindle','google','pdf'],
  borrowed: ['company','library','friend'],
}
const NOTE = {
  owned: '종이책과 전자책, PDF 로 소장처가 기록된 책이에요.',
  ebook: '교보, 리디, 킨들, 구글북스와 PDF 에 있는 책이에요.',
  borrowed: '회사, 도서관, 지인에게 빌린 것으로 기록된 책이에요. 반납 여부는 구분하지 않아요.',
}
const MAX_COLUMNS = 6

const $ = (s) => document.querySelector(s)
const rack = $('#rack'), detail = $('#detail')
const safe = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))

let BOOKS = [], query = '', selected = null, active = 'all', lastWidth = 0

/* 대표 주제는 첫 번째 것 하나 — 한 책이 여러 칸에 나오면 밀도가 낭비된다 */
const subjectOf = (b) => (b.groups || [])[0] || '미분류'
const idsOf = (b) => (b.sources || []).map((s) => s.id)
const inFilter = (b, key) => key === 'all' || idsOf(b).some((id) => SRC_FILTER[key].includes(id))

/* 같은 주제 안에서는 옅은 명도 차이만 둔다 */
function bookColor(b) {
  const base = (PALETTE[subjectOf(b)] || PALETTE['미분류'])[0]
  const hash = Array.from(b.title).reduce((n, c) => (n + c.codePointAt(0)) % 997, 0)
  const shift = [-9, -4, 0, 4, 8][hash % 5]
  return '#' + [1, 3, 5].map((i) =>
    Math.max(0, Math.min(255, parseInt(base.slice(i, i + 2), 16) + shift)).toString(16).padStart(2, '0')).join('')
}
/* 배경 밝기에 맞춰 글자색을 고른다 */
function ink(hex) {
  const c = hex.slice(1)
  const a = [0, 2, 4].map((i) => parseInt(c.slice(i, i + 2), 16) / 255)
                     .map((v) => v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4))
  return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2] > 0.179 ? '#171a16' : '#ffffff'
}

function showDetail() {
  detail.hidden = selected === null
  rack.querySelectorAll('.book').forEach((e) => e.setAttribute('aria-pressed', String(e.dataset.id === selected)))
  if (selected === null) { document.body.style.paddingBottom = ''; return }
  const b = BOOKS.find((x) => x.id === selected)
  if (!b) return
  const where = idsOf(b).map((id) =>
    `<span class="${SRC_FILTER.borrowed.includes(id) ? 'borrow' : ''}">${safe(SRC_NAME[id] || id)}</span>`
  ).join(' / ') || '소장처 미확인'
  detail.innerHTML =
    (b.cover ? `<img src="${safe(b.cover)}" alt="${safe(b.title)} 표지" loading="lazy" />` : '<span class="noimg"></span>') +
    `<div><h2>${safe(b.title)}</h2>` +
    `<p>${safe(b.author || '저자 미등록')}${b.gist ? ' — ' + safe(b.gist) : ''}</p>` +
    `<p class="where">${where}</p></div>` +
    '<button class="close" type="button" aria-label="책 정보 닫기">닫기</button>'
  detail.querySelector('button').onclick = () => {
    const id = selected
    selected = null
    showDetail()
    rack.querySelector(`[data-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: true })
  }
  document.body.style.paddingBottom = detail.offsetHeight + 'px'
}

function drawFilters(matches) {
  document.querySelectorAll('[data-filter]').forEach((btn) => {
    const key = btn.dataset.filter
    btn.setAttribute('aria-pressed', String(key === active))
    btn.querySelector('span').textContent = matches.filter((b) => inFilter(b, key)).length
  })
  const note = $('#note')
  note.hidden = active === 'all'
  note.textContent = NOTE[active] || ''
}

function render() {
  const width = rack.getBoundingClientRect().width
  const n = Math.min(MAX_COLUMNS, Math.max(2, Math.floor((width + 6) / 150)))
  const q = query.toLocaleLowerCase()
  const matches = BOOKS.filter((b) => (b.title + ' ' + (b.author || '')).toLocaleLowerCase().includes(q))
  drawFilters(matches)
  const found = matches.filter((b) => inFilter(b, active))
  $('#count').textContent = found.length + '권' + (query ? ' 찾음' : '')
  rack.style.gridTemplateColumns = `repeat(${n},minmax(0,1fr))`
  rack.innerHTML = ''
  if (!found.length) {
    rack.innerHTML = '<div class="empty">찾은 책이 없어요.</div>'
    selected = null; showDetail(); return
  }

  const groups = TOPICS.map((t) => ({ t, items: found.filter((b) => subjectOf(b) === t) })).filter((g) => g.items.length)
  const capacity = Math.ceil((found.length + groups.length) / n) + 1
  let column = null, used = 0, colIndex = -1
  const newColumn = () => { column = document.createElement('section'); column.className = 'column'; rack.append(column); used = 0; colIndex++ }
  const heading = (t, count, continued) => {
    const h = document.createElement('h2')
    h.className = 'subject'
    h.innerHTML = safe(t.replaceAll('·', ' / ')) + `<span>${continued ? '계속' : count + '권'}</span>`
    column.append(h); used++
  }

  newColumn()
  for (const group of groups) {
    if (used + 3 > capacity && colIndex < n - 1) newColumn()
    heading(group.t, group.items.length, false)
    for (const b of group.items) {
      if (used >= capacity && colIndex < n - 1) { newColumn(); heading(group.t, group.items.length, true) }
      const btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'book'
      btn.dataset.id = b.id
      btn.textContent = b.title
      btn.setAttribute('aria-label', b.title)
      btn.setAttribute('aria-pressed', String(selected === b.id))
      const color = bookColor(b)
      btn.style.setProperty('--book-color', color)
      btn.style.setProperty('--book-ink', ink(color))
      btn.onclick = () => { selected = selected === b.id ? null : b.id; showDetail() }
      column.append(btn); used++
    }
  }
  if (selected !== null && !found.some((b) => b.id === selected)) { selected = null; showDetail() }
}

document.querySelectorAll('[data-filter]').forEach((btn) =>
  btn.addEventListener('click', () => { active = btn.dataset.filter; render() }))
$('#q').addEventListener('input', (e) => { query = e.target.value.trim(); render() })
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && selected !== null) { selected = null; showDetail() } })

fetch('data/library.json')
  .then((r) => r.json())
  .then((d) => {
    // 제목이 안정적인 열쇠다 — 배열 자리는 데이터가 바뀌면 흔들린다
    BOOKS = d.books.map((b) => ({ ...b, id: b.title }))
    $('#updated').textContent = `${d.updatedAt} 갱신`
    render()
    new ResizeObserver(() => {
      const w = Math.round(rack.getBoundingClientRect().width)
      if (w !== lastWidth) { lastWidth = w; render() }
    }).observe(rack)
  })
  .catch(() => {
    $('#count').textContent = ''
    rack.innerHTML = '<div class="empty">책 목록을 불러오지 못했어요. 새로 고쳐 주세요.</div>'
  })
</script>
</body>
</html>
