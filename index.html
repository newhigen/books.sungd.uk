<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>책장</title>
<meta name="description" content="종이책과 리디·교보·킨들·구글북스에 흩어진 책을 한 곳에서 본다. books.sungd.uk" />
<meta name="color-scheme" content="light dark" />
<link rel="canonical" href="https://books.sungd.uk/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='6' width='5' height='16' rx='2.5' fill='%231e1c19'/%3E%3Crect x='13' y='9' width='5' height='13' rx='2.5' fill='%231e1c19'/%3E%3Crect x='20' y='7' width='5' height='15' rx='2.5' fill='%238c3b4a'/%3E%3Crect x='4' y='24' width='24' height='2.4' rx='1.2' fill='%231e1c19'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500&display=swap" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf9f6; --surface:#fff; --surface2:#f2f1ec;
  --border:#e8e6df; --line-strong:#d9d6cc;
  --text:#1e1c19; --muted:#6d6a63; --ink-3:#9c988e;
  --acc:#8c3b4a; --acc-bg:#f7edef;
  --shadow-sm:0 1px 2px rgba(30,28,25,.05),0 1px 3px rgba(30,28,25,.05);
  --shadow-md:0 3px 10px rgba(30,28,25,.07),0 10px 28px rgba(30,28,25,.08);
  --sans:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  --mono:'Google Sans Code',ui-monospace,'SF Mono',Menlo,monospace;
}
[data-theme="dark"]{
  --bg:#12110f; --surface:#1b1a17; --surface2:#242220;
  --border:#2c2a26; --line-strong:#3a3733;
  --text:#eceae5; --muted:#a09c93; --ink-3:#6e6a63;
  --acc:#c9808d; --acc-bg:#2b1c20;
  --shadow-sm:0 1px 2px rgba(0,0,0,.25);
  --shadow-md:0 3px 10px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.34);
}
html{scrollbar-gutter:stable}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13.5px;line-height:1.5;
     letter-spacing:-.01em;-webkit-font-smoothing:antialiased;padding-bottom:56px}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px;min-width:0}
button,select,input{font-family:inherit;letter-spacing:inherit}

/* ── 상단바 ── */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
     backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.brand{font-weight:800;font-size:15px;letter-spacing:-.03em}
.count{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:auto}
.themebtn{border:1px solid var(--border);background:var(--surface);color:var(--muted);
          border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:12px;line-height:1;
          display:grid;place-items:center;flex:none}
.themebtn:hover{border-color:var(--line-strong);color:var(--text)}

/* ── 검색·필터 ── */
.controls{padding-top:13px}
.search{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);
        border-radius:9px;padding:9px 12px;font-size:13.5px}
.search:focus{outline:none;border-color:var(--acc)}
.search::placeholder{color:var(--ink-3)}

/* 어디에 있는가 — 밑줄 탭 */
.tabs{display:flex;gap:1px;margin-top:11px;overflow-x:auto;scrollbar-width:none;
      border-bottom:1px solid var(--border)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;color:var(--muted);font-size:12.5px;
     padding:7px 10px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;
     margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);font-weight:700;border-bottom-color:var(--acc)}
.tab i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:4px}
.tab.on i{color:var(--acc)}

/* 주제 — 눌러서 켜고 끄는 글자 버튼. 아래 줄은 그 주제 안의 서브주제 */
.fields{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.fields::-webkit-scrollbar{display:none}
.fld{flex:none;border:1px solid transparent;background:none;color:var(--muted);font-size:12px;
     padding:3px 8px;border-radius:6px;cursor:pointer;white-space:nowrap}
.fld:hover{color:var(--text);background:var(--surface2)}
.fld.on{background:var(--acc-bg);color:var(--acc);border-color:var(--acc);font-weight:700}
.fld i{font-style:normal;font-family:var(--mono);font-size:10.5px;opacity:.65;margin-left:4px}
.subs{margin-top:3px;padding-left:11px;border-left:2px solid var(--acc-bg)}
.subs .fld{font-size:11.5px;padding:2px 7px;color:var(--ink-3)}

/* 도구 줄 */
.bar{display:flex;align-items:center;gap:8px;padding:12px 0 2px;font-size:12px;color:var(--ink-3)}
.bar .n{margin-right:auto;font-family:var(--mono)}
.viewsw{display:flex;gap:2px}
.viewsw button{border:0;background:none;color:var(--ink-3);font-size:12px;padding:3px 7px;
               border-radius:6px;cursor:pointer}
.viewsw button:hover{color:var(--text);background:var(--surface2)}
.viewsw button.on{color:var(--text);font-weight:700;background:var(--surface2)}
.bar select{border:1px solid var(--border);background:var(--surface);color:var(--muted);
            border-radius:6px;padding:3px 5px;font-size:12px;cursor:pointer;max-width:118px}

/* ── 표지 보기 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:17px 12px;
      padding:12px 0 36px;min-width:0}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:24px 17px}}
.book{cursor:pointer;border:0;background:none;padding:0;text-align:left;color:inherit;
      display:flex;flex-direction:column;gap:6px;min-width:0}
.cv{position:relative;aspect-ratio:2/3;border-radius:3px;overflow:hidden;background:var(--surface2);
    box-shadow:var(--shadow-sm);transition:transform .18s ease,box-shadow .18s ease}
.book:hover .cv{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv .ph{width:100%;height:100%;display:flex;align-items:flex-end;padding:8px;font-size:11px;
        font-weight:700;line-height:1.32;letter-spacing:-.02em;word-break:keep-all;
        color:rgba(255,255,255,.94);text-shadow:0 1px 2px rgba(0,0,0,.22)}
.bt{font-size:12px;font-weight:600;line-height:1.32;letter-spacing:-.02em;word-break:keep-all;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ba{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ── 목록 보기 ── */
.list{padding:6px 0 36px;min-width:0}
.row{display:flex;gap:11px;align-items:center;width:100%;padding:9px 2px;cursor:pointer;
     border:0;border-bottom:1px solid var(--border);background:none;color:inherit;text-align:left;
     min-width:0}
.row:hover{background:var(--surface2)}
.row .cv{width:34px;flex:none;border-radius:2px;box-shadow:none}
.row .cv .ph{padding:3px;font-size:7px;line-height:1.1;overflow:hidden}
.row .mid{flex:1;min-width:0}
.row .rt{font-size:13px;font-weight:600;letter-spacing:-.02em;line-height:1.35;
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .rs{font-size:11.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;
         text-overflow:ellipsis}
.row .rr{flex:none;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
         line-height:1.5}
.row .rr b{display:block;font-weight:400;color:var(--muted)}
/* ── 표 보기 — 표지 없이 촘촘하게 ── */
.tblwrap{overflow-x:auto;padding:4px 0 36px;min-width:0}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
.tbl th{text-align:left;font-weight:500;color:var(--ink-3);font-size:11.5px;padding:6px 10px 6px 0;
        border-bottom:1px solid var(--line-strong);white-space:nowrap}
.tbl td{padding:7px 10px 7px 0;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface2)}
.tbl .c-title{font-weight:600;letter-spacing:-.02em;line-height:1.35;width:42%}
.tbl .c-author{color:var(--muted);width:22%}
.tbl .c-field{color:var(--muted);width:15%;white-space:nowrap}
.tbl .c-where{color:var(--muted);width:13%;white-space:nowrap}
.tbl .c-read{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right;
             white-space:nowrap;padding-right:0}
.empty-msg{padding:56px 0;text-align:center;color:var(--ink-3);font-size:13px}

/* ── 상세 ── */
.sheet{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
       padding:20px;background:rgba(30,28,25,.42)}
.sheet.on{display:flex}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
      box-shadow:var(--shadow-md);max-width:430px;width:100%;max-height:86vh;overflow:auto;padding:19px}
@media(max-width:520px){
  .sheet{align-items:flex-end;padding:0}
  .card{border-radius:15px 15px 0 0;max-width:none;max-height:90vh;
        padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
}
.chead{display:flex;gap:13px}
.chead .cv{width:80px;flex:none}
.ctitle{font-size:15.5px;font-weight:800;letter-spacing:-.03em;line-height:1.3;word-break:keep-all}
.cmeta{font-size:12px;color:var(--muted);margin-top:4px}
.cen{font-size:11.5px;color:var(--ink-3);font-style:italic;margin-top:2px}
.cgist{margin-top:14px;font-size:13px;line-height:1.55;color:var(--muted);word-break:keep-all}
.rows{margin-top:16px;border-top:1px solid var(--border)}
.drow{display:flex;gap:11px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.drow dt{color:var(--ink-3);width:60px;flex:none;font-size:12px}
.drow dd{flex:1;min-width:0}
.where{display:flex;flex-wrap:wrap;gap:5px 0}
.where a,.where span{font-size:12.5px;color:var(--acc);text-decoration:none;
                     border-bottom:1px solid transparent}
.where a:hover{border-bottom-color:currentColor}
.where a:not(:last-child)::after,.where span:not(:last-child)::after{content:'·';color:var(--ink-3);margin:0 7px}
.tags{display:flex;flex-wrap:wrap;gap:3px 0}
.tags button{border:0;background:none;font-size:12.5px;color:var(--muted);cursor:pointer;padding:0}
.tags button:hover{color:var(--acc)}
.tags button:not(:last-child)::after{content:'·';color:var(--ink-3);margin:0 7px}
.tnum{font-family:var(--mono);font-size:12px}
.simil{margin-top:16px}
.simil h4{font-size:12px;color:var(--ink-3);font-weight:500;margin-bottom:8px}
.simil-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;min-width:0}
.simil-row button{border:0;background:none;padding:0;cursor:pointer;color:inherit;text-align:left;min-width:0}
.simil-row .st{font-size:10.5px;line-height:1.28;margin-top:4px;color:var(--muted);letter-spacing:-.02em;
               display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.simil-row button:hover .st{color:var(--text)}
.close{margin-top:15px;width:100%;border:1px solid var(--border);background:var(--surface2);
       color:var(--muted);border-radius:8px;padding:9px;font-size:12.5px;cursor:pointer}
.close:hover{color:var(--text);border-color:var(--line-strong)}

.note{margin-top:12px;padding:11px 13px;background:var(--acc-bg);border-radius:9px;
      font-size:12px;color:var(--muted);line-height:1.55}
.note b{color:var(--text);font-weight:700}
.foot{padding:22px 0 8px;border-top:1px solid var(--border);font-size:11.5px;color:var(--ink-3)}
.foot a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--border)}
.foot a:hover{color:var(--acc);border-bottom-color:currentColor}
.theme-switching *{transition:none !important}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <span class="brand">책장</span>
    <span class="count" id="count"></span>
    <button class="themebtn" id="theme" title="밝게/어둡게" aria-label="테마 전환">◐</button>
  </div>
</header>

<main class="wrap">
  <div class="controls">
    <input class="search" id="q" type="search" placeholder="제목·저자 검색" autocomplete="off" />
    <nav class="tabs" id="tabs"></nav>
    <div class="fields subs" id="subwhere" hidden></div>
    <div class="fields" id="groups"></div>
    <div class="fields subs" id="subtags" hidden></div>
    <div class="bar">
      <span class="n" id="shown"></span>
      <div class="viewsw" id="viewsw">
        <button data-v="grid">표지</button>
        <button data-v="list">목록</button>
        <button data-v="table">표</button>
      </div>
      <select id="sort" aria-label="정렬">
        <option value="read">최근 읽은 순</option>
        <option value="title">제목 순</option>
        <option value="author">저자 순</option>
        <option value="topic">주제 순</option>
      </select>
    </div>
    <div class="note" id="note" hidden></div>
  </div>

  <div id="out"></div>

  <div class="foot">
    <span id="updated"></span> ·
    <a href="https://writing.sungd.uk/books">읽은 기록</a> ·
    <a href="https://sungd.uk">sungd.uk</a>
  </div>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="card" id="card"></div>
</div>

<script>
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))

// 표지가 없는 책은 제목으로 색을 만들어 세워 둔다
function hue(s) {
  let h = 0
  for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) % 360
  return h
}
const placeholder = (b) =>
  `<div class="ph" style="background:linear-gradient(160deg,hsl(${hue(b.title)} 26% 46%),hsl(${(hue(b.title)+24)%360} 24% 34%))">${esc(b.title)}</div>`
const coverHTML = (b) =>
  b.cover
    ? `<img src="${esc(b.cover)}" alt="" loading="lazy" onerror="this.parentNode.innerHTML=this.dataset.ph" data-ph="${esc(placeholder(b))}" />`
    : placeholder(b)

const state = { where: 'all', src: '', group: '', tag: '', sort: 'read', q: '',
                view: localStorage.getItem('shelf-view') || 'grid' }
let DATA = { books: [], services: [], wheres: [], groups: [], updatedAt: '' }
// 주제 차례 — 태그 순 정렬과 서브주제 줄이 같은 차례를 쓴다
const tagRank = (t) => {
  let i = 0
  for (const g of DATA.groups) for (const x of g.tags) { if (x.name === t) return i; i++ }
  return 9999
}

const monthLabel = (m) => (m ? m.replace(/^(\d{4})-(\d{2})$/, (_, y, mo) => `${y}.${+mo}`) : '')
const serviceName = (id) => (DATA.services.find((s) => s.id === id) || {}).name || id

function visible() {
  const q = state.q.trim().toLowerCase()
  return DATA.books.filter((b) => {
    if (state.where === 'none' && b.sources.length) return false
    if (state.where !== 'all' && state.where !== 'none') {
      const g = DATA.wheres.find((w) => w.id === state.where)
      if (g && !b.sources.some((s) => g.ids.includes(s.id))) return false
    }
    if (state.src && !b.sources.some((s) => s.id === state.src)) return false
    if (state.group && !(b.groups || []).includes(state.group)) return false
    if (state.tag && !(b.tags || []).includes(state.tag)) return false
    if (!q) return true
    return (b.title + ' ' + b.author + ' ' + b.englishTitle + ' ' + b.publisher + ' ' + (b.tags || []).join(' '))
      .toLowerCase().includes(q)
  })
}

function sorted(list) {
  const c = [...list]
  const ko = (a, b) => a.localeCompare(b, 'ko')
  if (state.sort === 'title') c.sort((a, b) => ko(a.title, b.title))
  else if (state.sort === 'author') c.sort((a, b) => ko(a.author || '힣', b.author || '힣'))
  else if (state.sort === 'topic') {
    // 첫 태그의 차례로 줄 세운다 — 비슷한 주제가 붙어 나온다
    const key = (b) => Math.min(...((b.tags || []).map(tagRank).concat(9999)))
    c.sort((a, b) => key(a) - key(b) || ko(a.title, b.title))
  }
  else {
    // 최근 읽은 순 — 읽은 달이 있는 책이 먼저, 아직 안 읽은 책은 제목 순으로 뒤에
    c.sort((a, b) => {
      if (!a.readAt && !b.readAt) return ko(a.title, b.title)
      if (!a.readAt) return 1
      if (!b.readAt) return -1
      return b.readAt.localeCompare(a.readAt)
    })
  }
  return c
}

function render() {
  const list = sorted(visible())
  const idx = (b) => DATA.books.indexOf(b)

  $('#out').innerHTML = !list.length
    ? '<div class="empty-msg">찾는 책이 없어요</div>'
    : state.view === 'grid'
      ? `<div class="grid">${list.map((b) => `
          <button class="book" data-i="${idx(b)}">
            <div class="cv">${coverHTML(b)}</div>
            <div class="bt">${esc(b.title)}</div>
            <div class="ba">${esc(b.author || '저자 미상')}</div>
          </button>`).join('')}</div>`
      : state.view === 'table'
      ? `<div class="tblwrap"><table class="tbl">
          <thead><tr><th>제목</th><th>저자</th><th>주제</th><th>어디에</th><th style="text-align:right">읽음</th></tr></thead>
          <tbody>${list.map((b) => `
            <tr data-i="${idx(b)}">
              <td class="c-title">${esc(b.title)}</td>
              <td class="c-author">${esc(b.author || '')}</td>
              <td class="c-field">${esc((b.tags || []).join(' · '))}</td>
              <td class="c-where">${b.sources.map((s) => esc(serviceName(s.id))).join(' · ')}</td>
              <td class="c-read">${b.readAt ? esc(monthLabel(b.readAt)) : ''}</td>
            </tr>`).join('')}</tbody></table></div>`
      : `<div class="list">${list.map((b) => `
          <button class="row" data-i="${idx(b)}">
            <div class="cv">${coverHTML(b)}</div>
            <div class="mid">
              <div class="rt">${esc(b.title)}</div>
              <div class="rs">${esc(b.author || '저자 미상')}${b.tags?.length ? ' · ' + esc(b.tags.join(', ')) : ''}</div>
            </div>
            <div class="rr">
              <b>${b.sources.length ? b.sources.map((s) => esc(serviceName(s.id))).join(' · ') : ''}</b>
              ${b.readAt ? esc(monthLabel(b.readAt)) : ''}
            </div>
          </button>`).join('')}</div>`

  $('#shown').textContent = `${list.length}권`
  $('#tabs').querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.f === state.where))
  // 소장처 묶음을 고르면 그 안의 서비스 줄이 열린다 (하나뿐이면 열 것이 없다)
  const w = (DATA.wheres || []).find((x) => x.id === state.where)
  $('#subwhere').hidden = !w || w.services.length < 2
  if (w && w.services.length > 1) {
    $('#subwhere').innerHTML = w.services.map((s) =>
      `<button class="fld${s.id === state.src ? ' on' : ''}" data-src="${esc(s.id)}">${esc(s.name)}<i>${s.count}</i></button>`).join('')
  }
  $('#groups').querySelectorAll('.fld').forEach((f) => f.classList.toggle('on', f.dataset.group === state.group))
  // 주제를 고르면 그 안의 서브주제 줄이 열린다
  const g = (DATA.groups || []).find((x) => x.name === state.group)
  $('#subtags').hidden = !g
  if (g) {
    $('#subtags').innerHTML = g.tags.map((t) =>
      `<button class="fld${t.name === state.tag ? ' on' : ''}" data-tag="${esc(t.name)}">${esc(t.name)}<i>${t.count}</i></button>`).join('')
  }
  $('#viewsw').querySelectorAll('button').forEach((v) => v.classList.toggle('on', v.dataset.v === state.view))
}

function openBook(b) {
  const simil = (b.similar || []).map((i) => DATA.books[i]).filter(Boolean).slice(0, 4)
  const where = b.sources.length
    ? b.sources.map((s) => s.link
        ? `<a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(serviceName(s.id))}</a>`
        : `<span>${esc(serviceName(s.id))}</span>`).join('')
    : '<span style="color:var(--ink-3)">아직 확인 안 됨</span>'

  $('#card').innerHTML = `
    <div class="chead">
      <div class="cv">${coverHTML(b)}</div>
      <div>
        <div class="ctitle">${esc(b.title)}</div>
        ${b.englishTitle ? `<div class="cen">${esc(b.englishTitle)}</div>` : ''}
        <div class="cmeta">${esc(b.author || '저자 미상')}${b.publisher ? ' · ' + esc(b.publisher) : ''}</div>
      </div>
    </div>
    ${b.gist ? `<p class="cgist">${esc(b.gist)}</p>` : ''}
    <dl class="rows">
      <div class="drow"><dt>어디에</dt><dd class="where">${where}</dd></div>
      <div class="drow"><dt>읽음</dt><dd class="tnum">${b.read ? (monthLabel(b.readAt) || '읽음') : '아직'}</dd></div>
      ${b.groups?.length ? `<div class="drow"><dt>주제</dt><dd>${esc(b.groups.join(' · '))}</dd></div>` : ''}
      ${b.tags?.length ? `<div class="drow"><dt>태그</dt><dd class="tags">${b.tags.map((t) => `<button data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</dd></div>` : ''}
      ${b.form ? `<div class="drow"><dt>어떤 꼴</dt><dd>${esc(b.form)}</dd></div>` : ''}
      ${b.aladin || b.kyobo ? `<div class="drow"><dt>책 정보</dt><dd class="where">${
        b.aladin ? `<a href="${esc(b.aladin)}" target="_blank" rel="noopener">알라딘</a>` : ''
      }${b.kyobo ? `<a href="${esc(b.kyobo)}" target="_blank" rel="noopener">교보</a>` : ''}</dd></div>` : ''}
    </dl>
    ${simil.length ? `<div class="simil"><h4>비슷한 책</h4><div class="simil-row">${simil.map((s) => `
      <button data-go="${DATA.books.indexOf(s)}">
        <div class="cv">${coverHTML(s)}</div>
        <div class="st">${esc(s.title)}</div>
      </button>`).join('')}</div></div>` : ''}
    <button class="close">닫기</button>`
  $('#sheet').classList.add('on')
  $('#card').scrollTop = 0
}
const closeBook = () => $('#sheet').classList.remove('on')

// ── 이벤트 ──
$('#out').addEventListener('click', (e) => {
  const el = e.target.closest('[data-i]')
  if (el) openBook(DATA.books[+el.dataset.i])
})
$('#sheet').addEventListener('click', (e) => {
  const tag = e.target.closest('[data-tag]')
  if (tag) {
    // 태그를 누르면 그 태그가 속한 주제까지 같이 열어 준다
    const t = tag.dataset.tag
    const g = (DATA.groups || []).find((x) => x.tags.some((y) => y.name === t))
    state.group = g ? g.name : ''
    state.tag = t
    closeBook()
    render()
    return
  }
  const go = e.target.closest('[data-go]')
  if (go) return openBook(DATA.books[+go.dataset.go])
  if (e.target === $('#sheet') || e.target.classList.contains('close')) closeBook()
})
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBook() })
$('#q').addEventListener('input', (e) => { state.q = e.target.value; render() })
$('#sort').addEventListener('change', (e) => { state.sort = e.target.value; render() })
$('#viewsw').addEventListener('click', (e) => {
  const b = e.target.closest('[data-v]')
  if (!b) return
  state.view = b.dataset.v
  localStorage.setItem('shelf-view', state.view)
  render()
})

// 테마 — 전환 순간 transition 을 꺼서 카드가 하나씩 밀리지 않게
const setTheme = (t) => {
  document.documentElement.classList.add('theme-switching')
  document.documentElement.dataset.theme = t
  localStorage.setItem('shelf-theme', t)
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.documentElement.classList.remove('theme-switching')))
}
$('#theme').addEventListener('click', () =>
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'))
const saved = localStorage.getItem('shelf-theme')
if (saved) document.documentElement.dataset.theme = saved
else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'

// ── 데이터 ──
fetch('data/library.json?v=' + Date.now())
  .then((r) => r.json())
  .then((d) => {
    DATA = d
    const none = d.books.filter((b) => !b.sources.length).length
    // 어디에 있는가 — 온라인·종이책·빌린 것으로 감싸고, 누르면 그 안이 열린다
    const tabs = [{ id: 'all', name: '전체', count: d.books.length }]
      .concat((d.wheres || []).map((w) => ({ id: w.id, name: w.name, count: w.count })))
    if (none) tabs.push({ id: 'none', name: '소장처 미확인', count: none })
    $('#tabs').innerHTML = tabs.map((t) =>
      `<button class="tab" data-f="${t.id}">${esc(t.name)}<i>${t.count}</i></button>`).join('')
    $('#tabs').addEventListener('click', (e) => {
      const t = e.target.closest('.tab')
      if (!t) return
      state.where = t.dataset.f
      state.src = ''
      render()
    })
    $('#subwhere').addEventListener('click', (e) => {
      const f = e.target.closest('.fld')
      if (!f) return
      state.src = state.src === f.dataset.src ? '' : f.dataset.src
      render()
    })

    $('#groups').innerHTML = [{ name: '', label: '주제 전체', count: '' }]
      .concat((d.groups || []).map((g) => ({ name: g.name, label: g.name, count: g.count })))
      .map((g) => `<button class="fld" data-group="${esc(g.name)}">${esc(g.label)}${g.count ? `<i>${g.count}</i>` : ''}</button>`)
      .join('')
    $('#groups').addEventListener('click', (e) => {
      const f = e.target.closest('.fld')
      if (!f) return
      // 이미 켜진 주제를 다시 누르면 끈다. 주제를 바꾸면 서브주제는 풀린다.
      state.group = state.group === f.dataset.group ? '' : f.dataset.group
      state.tag = ''
      render()
    })
    $('#subtags').addEventListener('click', (e) => {
      const f = e.target.closest('.fld')
      if (!f) return
      state.tag = state.tag === f.dataset.tag ? '' : f.dataset.tag
      render()
    })

    $('#count').textContent = `${d.total}권`
    $('#updated').textContent = `${d.updatedAt} 갱신`
    if (!d.services.length) {
      $('#note').hidden = false
      $('#note').innerHTML = '아직 <b>읽은 기록</b>만 들어와 있어요.'
    }
    render()
  })
  .catch(() => { $('#out').innerHTML = '<div class="empty-msg">데이터를 불러오지 못했어요</div>' })
</script>
</body>
</html>
