<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>태그 붙이기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='8' width='6' height='16' rx='2.5' fill='%231e1c19'/%3E%3Crect x='13' y='8' width='6' height='16' rx='2.5' fill='%23c9c9c4'/%3E%3Crect x='21' y='8' width='6' height='16' rx='2.5' fill='%238c3b4a'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500&display=swap" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#141414;--sec:#3d3d3a;--muted:#6a6a66;--faint:#9b9b96;
      --rule:#f0f0ee;--rule2:#e3e3e0;--acc:#8c3b4a;--acc-bg:#fbf2f4;--ok:#3f7d58;
      --sans:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
      --mono:'Google Sans Code',ui-monospace,Menlo,monospace}
html{color-scheme:light}
body{background:#fff;color:var(--ink);font-family:var(--sans);font-size:12px;line-height:1.4;
     -webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:0 14px 32px}
button,input,select{font-family:inherit;letter-spacing:inherit;font-size:inherit}

/* ── 머리 — 스크롤해도 붙어 있다 ── */
.head{position:sticky;top:0;z-index:20;background:#fff;padding-top:10px}
.head::after{content:'';display:block;height:2px;background:var(--rule);position:relative}
.hrow{display:flex;align-items:center;gap:8px}
h1{font-size:13px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.tabs{display:flex;gap:1px}
.tab{border:0;background:none;color:var(--muted);padding:3px 8px 4px;cursor:pointer;
     border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--acc)}
.count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.count b{color:var(--ok);font-weight:500}
.save{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:3px 10px 4px;
      border-radius:5px;cursor:pointer}
.save.dirty{background:var(--acc);border-color:var(--acc)}
.save:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--rule2);background:#fff;color:var(--muted);padding:3px 8px 4px;
       border-radius:5px;cursor:pointer}
.ghost:hover{border-color:var(--ink);color:var(--ink)}

/* 얼마나 봤나 — 머리 맨 아래 선이 그대로 막대다 */
.fill{position:absolute;left:0;bottom:0;height:2px;background:var(--ok);width:0;transition:width .25s}

.frow{display:flex;align-items:center;gap:5px;padding:6px 0 7px}
.frow input[type=search]{flex:1;border:1px solid var(--rule2);border-radius:5px;padding:3px 8px 4px;
                         outline:none;min-width:0}
.frow input[type=search]:focus{border-color:var(--acc)}
.frow select{border:1px solid var(--rule2);border-radius:5px;padding:3px 5px;color:var(--sec);
             background:#fff}
.toggle{border:1px solid var(--rule2);background:#fff;color:var(--muted);padding:3px 8px 4px;
        border-radius:5px;cursor:pointer;white-space:nowrap}
.toggle.on{border-color:var(--ok);color:var(--ok);font-weight:650}

.note{font-size:11px;color:var(--faint);padding:0 0 8px;line-height:1.45}
.note b{color:var(--muted);font-weight:650}

/* ── 목록 ── */
table{width:100%;border-collapse:collapse;table-layout:fixed}
.w-c{width:26px}.w-b{width:31%}.w-t{width:auto}.w-m{width:19%}
td{padding:3px 8px 4px 0;border-bottom:1px solid var(--rule);vertical-align:top}
/* 다 본 책은 한 톤 물러나되 읽을 수는 있게 — 거의 다 찍고 나면 화면 전체가 흐려진다 */
tr.done .c-b{opacity:.62}
tr.sep td{padding:9px 0 2px;border:0;font-size:11px;font-weight:750;color:var(--acc);
          letter-spacing:-.02em}
/* 묶음이 태그보다 한 단 위 — 굵은 선으로 구간을 끊는다 */
tr.grp td{padding:20px 0 3px;border:0;border-top:1.5px solid var(--ink);font-size:12px;
          font-weight:800;color:var(--ink);letter-spacing:-.03em}
tr.grp:first-child td{padding-top:2px;border-top:0}
tr.grp + tr.sep td{padding-top:3px}

/* 다 봤다 — 왼쪽 끝에서 훑어 내려가며 찍는다 */
.c-c{padding-left:0;padding-top:5px}
.chk{width:15px;height:15px;border:1.5px solid var(--rule2);border-radius:4px;background:#fff;
     cursor:pointer;color:transparent;font-size:10px;line-height:1;padding:0;display:block}
.chk:hover{border-color:var(--ok)}
.chk.on{border-color:var(--ok);background:var(--ok);color:#fff}

.c-b b{font-weight:650;letter-spacing:-.02em;line-height:1.35;word-break:keep-all;
       overflow-wrap:anywhere}
.c-b em{font-style:normal;color:var(--faint);font-size:11px}
.c-b i{display:block;font-style:normal;font-size:11px;line-height:1.4;color:var(--muted);
       margin-top:1px}

/* 태그 — 자리는 그대로 두고 켜짐/꺼짐만 바뀐다 */
.tag,.sug,.addt{display:inline-flex;align-items:center;border-radius:4px;padding:1px 6px 2px;
                font-size:11px;margin:0 2px 2px 0;cursor:pointer;border:1px solid transparent;
                line-height:1.35}
.tag{background:var(--acc);color:#fff;font-weight:600;border-color:var(--acc)}
.tag:hover{background:#a04a5a;border-color:#a04a5a}
.sug{background:none;color:var(--faint);border-color:var(--rule2);border-style:dashed}
.sug:hover{border-color:var(--acc);border-style:solid;color:var(--acc);background:var(--acc-bg)}
.addt{border-color:var(--rule2);border-style:dashed;color:#c4c2bd;background:none}
.addt:hover{border-color:var(--acc);color:var(--acc)}
.tin{border:1px solid var(--acc);border-radius:4px;padding:1px 5px;font-size:11px;width:108px;
     outline:none}

/* 메모 — 사이트에 안 나가고 나에게 주는 지시를 적는 자리 */
.c-m textarea{width:100%;min-width:0;border:1px solid var(--rule2);border-radius:4px;
              padding:2px 6px;font-family:inherit;font-size:11px;line-height:1.4;resize:vertical;
              min-height:22px;outline:none;color:var(--sec);background:#fff;display:block}
.c-m textarea:focus{border-color:var(--acc);min-height:54px}
.c-m textarea:not(:placeholder-shown){border-color:var(--acc);background:var(--acc-bg);color:var(--ink)}
.c-m textarea::placeholder{color:#cecbc6}

/* ── 태그 정리 ── 묶음별로 세로 단에 흘린다 */
.tg{columns:4;column-gap:22px}
.tgg{break-inside:avoid;display:inline-block;width:100%;margin-bottom:13px}
.tgg h3{font-size:11px;font-weight:750;color:var(--acc);letter-spacing:-.02em;
        padding-bottom:2px;border-bottom:1px solid var(--rule2);margin-bottom:1px}
.tgg h3 span{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--faint);
             float:right;letter-spacing:0}
.tgi{display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--rule);padding:3px 1px}
.tgi.few .nm{color:var(--acc)}
.tgi .nm{font-weight:650;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgi .n{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.tgi button{border:0;background:none;color:#c4c2bd;cursor:pointer;font-size:10.5px;padding:0 2px}
.tgi button:hover{color:var(--acc)}

/* ── 책 추가 ── */
.add{max-width:520px}
.add label{display:block;font-size:11px;color:var(--muted);margin:9px 0 2px}
.add input[type=text]{width:100%;border:1px solid var(--rule2);border-radius:5px;padding:4px 8px;
                      outline:none}
.add input:focus{border-color:var(--acc)}
.srcs{display:flex;flex-wrap:wrap;gap:3px}
.srcs button{border:1px solid var(--rule2);background:#fff;border-radius:4px;padding:2px 7px 3px;
             font-size:11px;cursor:pointer;color:var(--sec)}
.srcs button.on{border-color:var(--acc);background:var(--acc-bg);color:var(--acc);font-weight:650}
.found{display:flex;gap:8px;border-top:1px solid var(--rule2);padding:8px 0 0;margin-top:9px}
.found img{width:38px}
.found .ft{font-weight:650}
.found .fa{font-size:11px;color:var(--muted)}
.go{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:4px 11px 5px;
    border-radius:5px;cursor:pointer;margin-top:10px}
.msg{font-size:11px;color:var(--acc);margin-top:6px;min-height:14px}

.pane{display:none}
.pane.on{display:block}

/* ── 폰 ── 표를 접어 카드로 쌓는다 ── */
@media (max-width: 720px) {
  .wrap{padding:0 10px 24px}
  .head{padding-top:8px}
  .hrow{flex-wrap:wrap;gap:6px}
  h1{font-size:12.5px}
  .tabs{order:3;width:100%;margin-top:2px}
  .tab{flex:1;text-align:center;padding:5px 2px 6px}
  .count{margin-left:auto}
  .frow{flex-wrap:wrap}
  .frow input[type=search]{flex:1 1 100%}
  .frow select,.toggle{flex:1}

  table,tbody,tr,td{display:block;width:auto}
  tr{border-bottom:1px solid var(--rule2);padding:6px 0 7px;position:relative}
  td{border:0;padding:0}
  .c-c{position:absolute;left:0;top:6px}
  .chk{width:22px;height:22px;font-size:12px}
  .c-b{padding-left:30px}
  .c-b b{font-size:12.5px}
  .c-t{padding:4px 0 0 30px}
  .tag,.sug,.addt{font-size:12px;padding:3px 9px 4px;margin:0 3px 3px 0}
  .c-m{padding:3px 0 0 30px}
  .c-m textarea{font-size:12px}
  .tg{columns:1}
  .add{max-width:none}
}
</style>
</head>
<body>
<div class="wrap">

<header class="head">
  <div class="hrow">
    <h1>태그 붙이기</h1>
    <div class="tabs">
      <button class="tab on" data-p="list">책 목록</button>
      <button class="tab" data-p="tags">태그 정리</button>
      <button class="tab" data-p="add">책 추가</button>
    </div>
    <span class="count" id="count"></span>
    <button class="ghost" id="revert" title="브라우저에 담아 둔 것을 버리고 저장된 상태로">되돌리기</button>
    <button class="save" id="save" disabled>저장</button>
  </div>
  <div class="frow" data-for="list">
    <input type="search" id="q" placeholder="제목·저자·태그" autocomplete="off" />
    <select id="filter">
      <option value="all">전체</option>
      <option value="untouched">아직 안 고친 것</option>
      <option value="notag">태그 없는 것</option>
      <option value="rare">드문 태그</option>
      <option value="memo">메모 있는 것</option>
    </select>
    <select id="sort">
      <option value="tag" selected>태그 순</option>
      <option value="recent">최근 읽은 순</option>
      <option value="title">제목 순</option>
      <option value="tagcount">태그 적은 순</option>
    </select>
    <button class="toggle" id="hidedone">다 본 것 숨기기</button>
  </div>
  <div class="fill" id="fill"></div>
</header>

<!-- 책 목록 -->
<section class="pane on" data-p="list">
  <p class="note">점선은 <b>추천</b>, 진한 것은 <b>붙은 태그</b> — 눌러서 켜고 끈다.
    왼쪽 네모를 찍으면 <b>다 본 책</b>이 되고 위 막대가 찬다.
    <b>메모</b>는 사이트에 안 나간다. 이 책을 어떻게 할지 적어 두면 내가 읽고 처리한다.</p>
  <table>
    <colgroup><col class="w-c" /><col class="w-b" /><col class="w-t" /><col class="w-m" /></colgroup>
    <tbody id="rows"></tbody>
  </table>
</section>

<!-- 태그 정리 -->
<section class="pane" data-p="tags">
  <p class="note">책 수가 적은 태그는 <b>붉은 글씨</b>다. 이름을 바꾸거나 다른 태그에 합치거나 지운다.</p>
  <div class="tg" id="tglist"></div>
</section>

<!-- 책 추가 -->
<section class="pane add" data-p="add">
  <p class="note">제목을 넣고 <b>찾기</b>를 누르면 알라딘에서 표지·저자를 가져온다.
    어디에 있는지 고르고 담으면 <code>sources/manual.json</code> 에 들어간다.</p>
  <label>제목</label>
  <input type="text" id="atitle" placeholder="예: 함께 자라기" />
  <label>어디에 있나</label>
  <div class="srcs" id="asrcs"></div>
  <label>태그 (쉼표로 여러 개)</label>
  <input type="text" id="atags" placeholder="예: 개발자 태도, 애자일" />
  <div id="afound"></div>
  <button class="go" id="asearch">찾기</button>
  <button class="go" id="aadd" style="background:var(--acc);border-color:var(--acc)">담기</button>
  <div class="msg" id="amsg"></div>
</section>

</div>
<script>
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const SERVICES = [
  ['paper', '종이책'], ['ridi', '리디북스'], ['kyobo', '교보 sam'], ['kindle', '킨들'],
  ['google', '구글 북스'], ['pdf', 'PDF'], ['library', '도서관'], ['company', '회사'],
]

// 주제 태그를 뜻이 가까운 것끼리 묶어 둔다. 이 차례가 목록 정렬에도, 태그 정리 화면의
// 묶음에도 그대로 쓰인다. 여기 없는 태그는 '그 밖' 으로 모인다.
const TAG_GROUPS = [
  ['개발·기술', ['개발자 태도', '개발자 커리어', '개발 조직', '코드 품질', '설계·아키텍처',
                '시스템 설계', '알고리즘', '개발 방법론', '애자일', '테크니컬 라이팅',
                'DB', '인프라', 'IT']],
  ['데이터·AI', ['ML', 'MLOps', 'AI', '데이터 분석', '통계·수학']],
  ['만들기', ['UI/UX', '디자인', '프로덕트', '창업']],
  ['일·조직', ['리더십', '매니저', '팀', 'HR', '일하는 법', '커리어', '성공']],
  ['배우기·생각', ['학습', '성장', '노트·기록', '독서', '글쓰기', '말하기', '시간 관리',
                 '의사결정', '문제 해결', '사고법']],
  ['마음·관계', ['심리', '멘탈', '완벽주의', '습관', '대화', '관계', 'INFJ']],
  ['삶·교양', ['인생', '일상', '정리', '철학', '인문', '역사', '사회', '법', '돈']],
  ['문학', ['고전', '한국소설', '일본소설', '추리', '에세이']],
  ['몸·취미', ['건강', '운동', '음식', '여행', '예술', '건축', '사진', '일본어']],
]
const TAG_ORDER = TAG_GROUPS.flatMap(([, list]) => list)
const TAG_OF = new Map(TAG_GROUPS.flatMap(([g, list]) => list.map((t) => [t, g])))
const tagRank = (t) => {
  const i = TAG_ORDER.indexOf(t)
  return i < 0 ? TAG_ORDER.length : i
}

let BOOKS = []          // 화면에 보이는 책
let TAGS = {}           // 제목 → [태그]
let NOTES = {}          // 제목 → 메모 (사이트에 안 나감, 나에게 주는 지시)
let SUGGEST = {}        // 제목 → 추천 태그
let DONE = new Set()    // 다 봤다고 표시한 책
let touched = new Set() // 사람이 손댄 책
let dirty = false
let hideDone = false

function counts() {
  const c = {}
  for (const list of Object.values(TAGS)) for (const t of list) c[t] = (c[t] || 0) + 1
  return c
}
const rare = () => {
  const c = counts()
  return new Set(Object.keys(c).filter((t) => c[t] <= 2))
}

const LOCAL = 'tagger-draft'
// 태그 어휘를 갈아엎으면 올린다. 안 그러면 브라우저에 남은 옛 초안이 새 태그를 덮는다.
const TAG_VER = 2
function keep() {
  try {
    localStorage.setItem(LOCAL, JSON.stringify({
      ver: TAG_VER, tags: TAGS, notes: NOTES, done: [...DONE], touched: [...touched],
    }))
  } catch (e) {}
}
function markDirty() {
  dirty = true
  keep()
  const b = $('#save')
  b.disabled = false
  b.classList.add('dirty')
  b.textContent = '저장'
}

// ── 목록 ──
function visible() {
  const q = $('#q').value.trim().toLowerCase()
  const f = $('#filter').value
  const R = rare()
  const list = BOOKS.filter((b) => {
    const tags = TAGS[b.title] || []
    if (hideDone && DONE.has(b.title)) return false
    if (f === 'untouched' && touched.has(b.title)) return false
    if (f === 'notag' && tags.length) return false
    if (f === 'rare' && !tags.some((t) => R.has(t))) return false
    if (f === 'memo' && !(NOTES[b.title] || '').trim()) return false
    if (!q) return true
    return (b.title + ' ' + b.author + ' ' + tags.join(' ')).toLowerCase().includes(q)
  })
  const s = $('#sort').value
  if (s === 'title') list.sort((a, b) => a.title.localeCompare(b.title, 'ko'))
  else if (s === 'tagcount') list.sort((a, b) => (TAGS[a.title] || []).length - (TAGS[b.title] || []).length)
  else if (s === 'tag') {
    // 첫 태그의 자리로 줄 세우고, 같으면 두 번째 태그 → 제목 순
    const key = (b) => {
      const t = TAGS[b.title] || []
      if (!t.length) return [9999, 9999, b.title]
      const sorted = [...t].sort((x, y) => tagRank(x) - tagRank(y))
      return [tagRank(sorted[0]), sorted[1] ? tagRank(sorted[1]) : -1, b.title]
    }
    list.sort((a, b) => {
      const ka = key(a), kb = key(b)
      return ka[0] - kb[0] || ka[1] - kb[1] || ka[2].localeCompare(kb[2], 'ko')
    })
  }
  return list
}

function drawList() {
  // 다시 그리기 전에 지금 화면의 메모를 걷어 둔다
  document.querySelectorAll('textarea[data-m]').forEach((ta) => { NOTES[ta.dataset.m] = ta.value })
  const list = visible()
  const byTag = $('#sort').value === 'tag'
  let lastHead = null, lastGrp = null
  $('#rows').innerHTML = list.map((b) => {
    const tags = TAGS[b.title] || []
    const sug = SUGGEST[b.title] || []
    const done = DONE.has(b.title)
    let head = ''
    if (byTag) {
      const first = [...tags].sort((x, y) => tagRank(x) - tagRank(y))[0] || '(아직 없음)'
      // 묶음(개발·기술 …) 이 먼저, 그 아래 태그
      const grp = TAG_OF.get(first) || '그 밖'
      if (grp !== lastGrp) {
        lastGrp = grp
        head += `<tr class="grp"><td colspan="4">${esc(grp)}</td></tr>`
      }
      if (first !== lastHead) {
        lastHead = first
        head += `<tr class="sep"><td colspan="4">${esc(first)}</td></tr>`
      }
    }
    const meta = [b.author, b.form].filter(Boolean).join(' · ')
    return head + `<tr data-t="${esc(b.title)}"${done ? ' class="done"' : ''}>
      <td class="c-c"><button class="chk${done ? ' on' : ''}" data-done title="다 봤다">✓</button></td>
      <td class="c-b"><b>${esc(b.title)}</b>${meta ? ` <em>${esc(meta)}</em>` : ''}
        ${b.gist ? `<i>${esc(b.gist)}</i>` : ''}</td>
      <td class="c-t">
        ${[...sug, ...tags.filter((t) => !sug.includes(t))].map((t) => {
          const on = tags.includes(t)
          return `<button class="${on ? 'tag' : 'sug'}" data-${on ? 'del' : 'pick'}="${esc(t)}">${esc(t)}</button>`
        }).join('')}
        <button class="addt" data-add>+</button>
      </td>
      <td class="c-m"><textarea data-m="${esc(b.title)}" rows="1" placeholder="메모">${esc(NOTES[b.title] || '')}</textarea></td>
    </tr>`
  }).join('')
  drawCount(list.length)
}

function drawCount(shown) {
  const all = BOOKS.length
  const n = BOOKS.filter((b) => DONE.has(b.title)).length
  const pct = all ? Math.round((n / all) * 100) : 0
  $('#fill').style.width = pct + '%'
  const memo = Object.values(NOTES).filter((v) => (v || '').trim()).length
  $('#count').innerHTML = `<b>${n}</b>/${all} (${pct}%) · ${shown}권 보임`
    + ` · 태그 ${Object.keys(counts()).length}종` + (memo ? ` · 메모 ${memo}` : '')
}

$('#rows').addEventListener('input', (e) => {
  const ta = e.target.closest('textarea[data-m]')
  if (!ta) return
  NOTES[ta.dataset.m] = ta.value
  markDirty()
})

$('#rows').addEventListener('click', (e) => {
  const tr = e.target.closest('tr')
  if (!tr) return
  const title = tr.dataset.t

  if (e.target.closest('[data-done]')) {
    if (DONE.has(title)) DONE.delete(title)
    else DONE.add(title)
    markDirty(); drawList(); return
  }
  const del = e.target.closest('[data-del]')
  if (del) {
    TAGS[title] = (TAGS[title] || []).filter((t) => t !== del.dataset.del)
    touched.add(title); markDirty(); drawList(); return
  }
  const pick = e.target.closest('[data-pick]')
  if (pick) {
    TAGS[title] = [...new Set([...(TAGS[title] || []), pick.dataset.pick])]
    touched.add(title); markDirty(); drawList(); return
  }
  const addBtn = e.target.closest('[data-add]')
  if (addBtn) {
    const inp = document.createElement('input')
    inp.className = 'tin'
    inp.setAttribute('list', 'alltags')
    inp.placeholder = '태그 + 엔터'
    addBtn.replaceWith(inp)
    inp.focus()
    const finish = (save) => {
      const v = inp.value.trim()
      if (save && v) {
        TAGS[title] = [...new Set([...(TAGS[title] || []), v])]
        touched.add(title); markDirty()
      }
      drawList()
    }
    inp.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') finish(true)
      else if (ev.key === 'Escape') finish(false)
    })
    inp.addEventListener('blur', () => finish(true))
  }
})
;['#q', '#filter', '#sort'].forEach((s) => $(s).addEventListener('input', drawList))

$('#hidedone').addEventListener('click', () => {
  hideDone = !hideDone
  $('#hidedone').classList.toggle('on', hideDone)
  $('#hidedone').textContent = hideDone ? '다 본 것 보이기' : '다 본 것 숨기기'
  drawList()
})

// ── 태그 정리 ── 뜻이 가까운 것끼리 묶어 보여 준다
function drawTags() {
  const c = counts()
  const seen = new Set()
  const blocks = TAG_GROUPS.map(([name, list]) => {
    const rows = list.filter((t) => c[t])
    rows.forEach((t) => seen.add(t))
    return [name, rows]
  })
  const rest = Object.keys(c).filter((t) => !seen.has(t)).sort((a, b) => c[b] - c[a])
  if (rest.length) blocks.push(['그 밖', rest])

  $('#tglist').innerHTML = blocks.filter(([, rows]) => rows.length).map(([name, rows]) => {
    const sum = rows.reduce((a, t) => a + c[t], 0)
    return `<section class="tgg">
      <h3>${esc(name)} <span>${rows.length}종 · ${sum}권</span></h3>
      ${rows.map((t) => `<div class="tgi${c[t] <= 2 ? ' few' : ''}">
        <span class="nm">${esc(t)}</span><span class="n">${c[t]}</span>
        <button data-ren="${esc(t)}">이름</button>
        <button data-mrg="${esc(t)}">합치기</button>
        <button data-del="${esc(t)}">지우기</button>
      </div>`).join('')}
    </section>`
  }).join('')
}
$('#tglist').addEventListener('click', (e) => {
  const b = e.target.closest('button')
  if (!b) return
  const [kind, tag] = b.dataset.ren ? ['ren', b.dataset.ren]
    : b.dataset.mrg ? ['mrg', b.dataset.mrg] : ['del', b.dataset.del]
  if (kind === 'del') {
    for (const k of Object.keys(TAGS)) TAGS[k] = TAGS[k].filter((t) => t !== tag)
  } else {
    const to = window.prompt(kind === 'ren' ? `"${tag}" 을 무엇으로 바꿀까` : `"${tag}" 을 어느 태그에 합칠까`, tag)
    if (!to || !to.trim()) return
    const v = to.trim()
    for (const k of Object.keys(TAGS)) TAGS[k] = [...new Set(TAGS[k].map((t) => (t === tag ? v : t)))]
  }
  markDirty(); drawTags(); drawList()
})

// ── 책 추가 ──
$('#asrcs').innerHTML = SERVICES.map(([id, nm]) => `<button data-s="${id}">${nm}</button>`).join('')
$('#asrcs').addEventListener('click', (e) => {
  const b = e.target.closest('button')
  if (b) b.classList.toggle('on')
})
let foundBook = null
$('#asearch').addEventListener('click', async () => {
  const q = $('#atitle').value.trim()
  if (!q) return
  $('#amsg').textContent = '찾는 중…'
  const r = await fetch('../api/search?q=' + encodeURIComponent(q)).then((x) => x.json())
  foundBook = r.found
  if (!foundBook) { $('#amsg').textContent = '못 찾았다. 제목만으로 담아도 된다.'; $('#afound').innerHTML = ''; return }
  $('#amsg').textContent = ''
  $('#afound').innerHTML = `<div class="found">
    ${foundBook.cover ? `<img src="${esc(foundBook.cover)}">` : ''}
    <div><div class="ft">${esc(foundBook.title)}</div>
    <div class="fa">${esc(foundBook.author)} · ${esc(foundBook.publisher || '')}</div></div></div>`
})
$('#aadd').addEventListener('click', async () => {
  const title = (foundBook?.title || $('#atitle').value).trim()
  if (!title) return
  const srcs = [...$('#asrcs').querySelectorAll('.on')].map((b) => b.dataset.s)
  if (!srcs.length) { $('#amsg').textContent = '어디에 있는지 하나는 골라야 한다'; return }
  const body = { title, author: foundBook?.author || '', cover: foundBook?.cover || '',
                 publisher: foundBook?.publisher || '', link: foundBook?.aladin || '', sources: srcs }
  const r = await fetch('../api/add', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                      body: JSON.stringify({ ...body, service: srcs[0] }) }).then((x) => x.json())
  if (r.error) { $('#amsg').textContent = r.error; return }
  const tags = $('#atags').value.split(',').map((s) => s.trim()).filter(Boolean)
  if (tags.length) { TAGS[title] = tags; touched.add(title); markDirty() }
  $('#amsg').textContent = `담았다 (manual.json ${r.count}권). node scripts/build.mjs 로 반영한다.`
  $('#atitle').value = ''; $('#atags').value = ''; $('#afound').innerHTML = ''; foundBook = null
})

// ── 저장 ──
$('#save').addEventListener('click', async () => {
  const b = $('#save')
  b.textContent = '저장 중…'
  const r = await fetch('../api/tags', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                       body: JSON.stringify({ tags: TAGS, notes: NOTES, done: [...DONE] }) })
    .then((x) => x.json())
  if (r.ok) {
    dirty = false
    localStorage.removeItem(LOCAL)
    b.classList.remove('dirty'); b.disabled = true; b.textContent = '저장됨'
  } else b.textContent = r.error || '실패'
})

$('#revert').addEventListener('click', () => {
  if (dirty && !window.confirm('브라우저에 담아 둔 것을 버리고 저장된 상태로 돌아간다. 계속할까?')) return
  localStorage.removeItem(LOCAL)
  location.reload()
})

// ── 탭 ── 거르개 줄은 책 목록에서만 쓴다
document.querySelector('.tabs').addEventListener('click', (e) => {
  const t = e.target.closest('.tab')
  if (!t) return
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === t))
  document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('on', p.dataset.p === t.dataset.p))
  $('.frow').style.display = t.dataset.p === 'list' ? '' : 'none'
  if (t.dataset.p === 'tags') drawTags()
})

// ── 시작 ──
Promise.all([
  fetch('../data/library.json?v=' + Date.now()).then((r) => r.json()),
  fetch('../data/tags-suggested.json?v=' + Date.now()).then((r) => r.json()),
  fetch('../data/tags.json?v=' + Date.now()).then((r) => (r.ok ? r.json() : {})).catch(() => ({})),
  fetch('../data/notes.json?v=' + Date.now()).then((r) => (r.ok ? r.json() : {})).catch(() => ({})),
  fetch('../data/done.json?v=' + Date.now()).then((r) => (r.ok ? r.json() : [])).catch(() => []),
]).then(([lib, sug, saved, notes, done]) => {
  NOTES = notes || {}
  BOOKS = lib.books
  SUGGEST = sug
  DONE = new Set(done || [])
  for (const b of BOOKS) {
    // 추천은 추천일 뿐이다. 고른 것만 태그가 된다.
    TAGS[b.title] = saved[b.title] ? [...saved[b.title]] : []
    if (saved[b.title]?.length) touched.add(b.title)
  }
  // 저장 전에 닫았더라도 쓰던 것이 남아 있으면 되살린다
  try {
    const draft = JSON.parse(localStorage.getItem(LOCAL) || 'null')
    if (draft && draft.ver !== TAG_VER) {
      // 어휘가 바뀌었다 — 옛 초안의 태그는 버리고 메모만 살린다
      Object.assign(NOTES, draft.notes || {})
      localStorage.removeItem(LOCAL)
    } else if (draft) {
      Object.assign(TAGS, draft.tags || {})
      Object.assign(NOTES, draft.notes || {})
      ;(draft.done || []).forEach((t) => DONE.add(t))
      ;(draft.touched || []).forEach((t) => touched.add(t))
      markDirty()
      $('#save').textContent = '저장 (쓰던 것 있음)'
    }
  } catch (e) {}

  const dl = document.createElement('datalist')
  dl.id = 'alltags'
  document.body.appendChild(dl)
  const refreshTagList = () => {
    dl.innerHTML = Object.keys(counts()).map((t) => `<option value="${esc(t)}">`).join('')
  }
  refreshTagList()
  setInterval(refreshTagList, 3000)
  drawList()
})
</script>
</body>
</html>
